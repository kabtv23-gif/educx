<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUCX — Cours de Mathématiques</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<script>
MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']],
    displayMath: [['\\[','\\]']],
    packages: {'[+]': ['ams']},
    tags: 'none'
  },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script"></script>
<style>
:root {
  --bg: #07080f;
  --surface: #0f1120;
  --surface2: #171929;
  --border: rgba(255,255,255,0.08);
  --accent: #5b6ef8;
  --accent2: #f85b9e;
  --accent3: #5bf8c4;
  --gold: #f8c25b;
  --text: #e8eaf6;
  --muted: #6b7280;
  --radius: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  background:var(--bg); color:var(--text);
  font-family:'DM Sans',sans-serif; font-size:16px;
  line-height:1.6; overflow-x:hidden;
}
body::before {
  content:''; position:fixed; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none; z-index:9999; opacity:0.4;
}
.blob { position:fixed; border-radius:50%; filter:blur(120px); pointer-events:none; z-index:0; opacity:0.12; }
.blob-1 { width:600px; height:600px; background:var(--accent); top:-200px; left:-200px; }
.blob-2 { width:500px; height:500px; background:var(--accent2); bottom:-150px; right:-150px; }
.blob-3 { width:400px; height:400px; background:var(--accent3); top:40%; left:40%; }

/* NAV */
nav {
  position:fixed; top:0; left:0; right:0; z-index:1000;
  padding:0 32px; height:70px;
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(7,8,15,0.85); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.logo {
  font-family:'Syne',sans-serif; font-weight:800; font-size:1.6rem;
  letter-spacing:-1px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent3) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text; text-decoration:none; cursor:pointer;
}
.nav-back {
  color:var(--muted); text-decoration:none; font-size:0.88rem;
  display:flex; align-items:center; gap:6px; transition:color 0.2s;
}
.nav-back:hover { color:var(--text); }
.nav-right { display:flex; align-items:center; gap:16px; }
.nav-premium {
  background:linear-gradient(135deg,var(--gold),#f8a25b);
  color:#000; padding:7px 18px; border-radius:50px;
  font-size:0.82rem; font-weight:700; text-decoration:none;
  transition:transform 0.2s, box-shadow 0.2s;
}
.nav-premium:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(248,194,91,0.35); }

/* LAYOUT */
.layout { display:flex; min-height:100vh; padding-top:70px; }

/* SIDEBAR */
.sidebar {
  width:280px; flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  height:calc(100vh - 70px);
  position:sticky; top:70px;
  overflow-y:auto; padding:20px 0;
  z-index:10;
}
.sidebar::-webkit-scrollbar { width:4px; }
.sidebar::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

.sidebar-header { padding:0 20px 16px; border-bottom:1px solid var(--border); margin-bottom:12px; }
.sidebar-title { font-family:'Syne',sans-serif; font-size:0.7rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--accent); }

.sb-group { margin-bottom:4px; }
.sb-group-title {
  font-size:0.65rem; font-weight:700; text-transform:uppercase;
  letter-spacing:2px; color:var(--muted); padding:10px 20px 4px;
}
.sb-item {
  display:flex; align-items:center; gap:10px;
  padding:9px 20px; cursor:pointer;
  transition:background 0.15s; border-left:3px solid transparent;
  font-size:0.84rem; font-weight:500;
}
.sb-item:hover { background:rgba(91,110,248,0.07); color:var(--text); }
.sb-item.active { background:rgba(91,110,248,0.12); border-left-color:var(--accent); color:var(--accent); }
.sb-item .icon { font-size:1.1rem; flex-shrink:0; width:22px; text-align:center; }
.sb-item .name { flex:1; line-height:1.3; }
.sb-badge {
  font-size:0.6rem; padding:2px 7px; border-radius:50px;
  font-weight:800; flex-shrink:0; text-transform:uppercase;
}
.sb-badge.col { background:rgba(248,194,91,0.15); color:var(--gold); }
.sb-badge.lyc { background:rgba(180,91,248,0.15); color:#b45bf8; }
.sb-badge.lock { background:rgba(248,91,158,0.1); color:var(--accent2); }

/* MAIN */
.main { flex:1; padding:36px 40px; max-width:860px; position:relative; z-index:1; }

/* CHAPTER HEADER */
.ch-header {
  background:linear-gradient(135deg, rgba(91,110,248,0.12), rgba(91,248,196,0.06));
  border:1px solid rgba(91,110,248,0.2);
  border-radius:24px; padding:32px; margin-bottom:32px;
}
.ch-top { display:flex; align-items:flex-start; gap:20px; margin-bottom:16px; }
.ch-emoji { font-size:3rem; line-height:1; }
.ch-meta { flex:1; }
.ch-tags { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.tag {
  padding:3px 12px; border-radius:50px;
  font-size:0.68rem; font-weight:800; text-transform:uppercase; letter-spacing:0.5px;
}
.tag-maths { background:rgba(91,110,248,0.15); color:var(--accent); }
.tag-col { background:rgba(248,194,91,0.12); color:var(--gold); }
.tag-lyc { background:rgba(180,91,248,0.12); color:#b45bf8; }
.ch-titre { font-family:'Syne',sans-serif; font-size:1.9rem; font-weight:800; letter-spacing:-0.5px; margin-bottom:8px; }
.ch-desc { color:var(--muted); font-size:0.95rem; line-height:1.6; }
.ch-stats { display:flex; gap:20px; margin-top:16px; flex-wrap:wrap; }
.ch-stat { display:flex; align-items:center; gap:7px; font-size:0.82rem; color:var(--muted); }

/* TABS */
.tabs { display:flex; gap:4px; margin-bottom:28px; background:var(--surface); border-radius:12px; padding:4px; }
.tab-btn {
  flex:1; padding:9px 12px; border:none; border-radius:9px;
  background:transparent; color:var(--muted);
  font-family:'DM Sans',sans-serif; font-size:0.82rem; font-weight:600;
  cursor:pointer; transition:all 0.2s; text-align:center;
}
.tab-btn.active { background:var(--accent); color:#fff; }
.tab-btn:hover:not(.active) { color:var(--text); background:rgba(255,255,255,0.05); }

.tab-panel { display:none; }
.tab-panel.active { display:block; }

/* LECONS NAV */
.lecons-nav { display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
.lecon-pill {
  padding:7px 16px; border-radius:50px; border:1px solid var(--border);
  background:transparent; color:var(--muted);
  font-family:'DM Sans',sans-serif; font-size:0.8rem; font-weight:500;
  cursor:pointer; transition:all 0.2s; display:flex; align-items:center; gap:6px;
}
.lecon-pill:hover { border-color:var(--accent); color:var(--text); }
.lecon-pill.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.lecon-pill .pill-num {
  width:18px; height:18px; border-radius:50%;
  background:rgba(255,255,255,0.2); font-size:0.65rem; font-weight:800;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}

/* CONTENT SECTIONS */
.section { margin-bottom:28px; }

.section-title {
  font-family:'Syne',sans-serif; font-size:1.2rem; font-weight:800;
  margin-bottom:14px; display:flex; align-items:center; gap:10px;
  padding-bottom:10px; border-bottom:1px solid var(--border);
}
.section-title::before {
  content:''; width:4px; height:20px;
  background:linear-gradient(180deg,var(--accent),var(--accent3));
  border-radius:4px; flex-shrink:0;
}

p { color:var(--muted); line-height:1.8; margin-bottom:10px; font-size:0.95rem; }
p strong, p b { color:var(--text); }

/* DEFINITION BOX */
.def-box {
  background:rgba(91,110,248,0.06);
  border:1px solid rgba(91,110,248,0.25);
  border-radius:16px; padding:20px 24px; margin:16px 0;
  position:relative;
}
.def-label {
  display:inline-flex; align-items:center; gap:6px;
  background:var(--accent); color:#fff;
  font-size:0.62rem; font-weight:800; letter-spacing:1.5px;
  text-transform:uppercase; padding:4px 12px; border-radius:50px;
  margin-bottom:12px;
}
.def-body { color:var(--text); font-size:0.92rem; line-height:1.8; }

/* FORMULE BOX */
.formule-box {
  background:var(--surface2);
  border:1px solid rgba(91,110,248,0.3);
  border-left:4px solid var(--accent);
  border-radius:0 16px 16px 0;
  padding:18px 22px; margin:16px 0;
}
.formule-label {
  font-size:0.62rem; font-weight:800; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--accent); margin-bottom:10px;
}
.formule-body {
  color:var(--text); font-size:1rem; line-height:2.2; text-align:center;
}

/* THEOREME */
.theoreme-box {
  background:linear-gradient(135deg, rgba(248,194,91,0.06), rgba(248,194,91,0.03));
  border:1px solid rgba(248,194,91,0.3);
  border-radius:16px; padding:22px 26px; margin:16px 0;
}
.theoreme-label {
  font-family:'Syne',sans-serif; font-size:0.78rem; font-weight:800;
  letter-spacing:1px; text-transform:uppercase; color:var(--gold);
  margin-bottom:10px; display:flex; align-items:center; gap:8px;
}
.theoreme-body { color:var(--text); font-size:0.93rem; line-height:1.9; }

/* EXEMPLE BOX */
.exemple-box {
  background:rgba(91,248,196,0.04);
  border:1px solid rgba(91,248,196,0.18);
  border-radius:16px; padding:20px 24px; margin:16px 0;
}
.exemple-label {
  font-size:0.68rem; font-weight:800; letter-spacing:2px;
  text-transform:uppercase; color:var(--accent3); margin-bottom:14px;
  display:flex; align-items:center; gap:8px;
}
.exemple-steps { display:flex; flex-direction:column; gap:10px; }
.step {
  display:flex; gap:12px; align-items:flex-start;
  font-size:0.9rem; color:var(--text); line-height:1.7;
}
.step-num {
  width:26px; height:26px; border-radius:50%; flex-shrink:0;
  background:rgba(91,248,196,0.15); color:var(--accent3);
  font-size:0.72rem; font-weight:800;
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}

/* ASTUCE */
.astuce-box {
  background:rgba(248,194,91,0.05);
  border:1px solid rgba(248,194,91,0.22);
  border-radius:14px; padding:16px 20px; margin:14px 0;
  display:flex; gap:14px;
}
.astuce-icon { font-size:1.4rem; flex-shrink:0; margin-top:1px; }
.astuce-content { flex:1; }
.astuce-title { font-weight:700; color:var(--gold); font-size:0.85rem; margin-bottom:5px; }
.astuce-text { color:var(--muted); font-size:0.88rem; line-height:1.7; }

/* DOMINO / RÉCURRENCE VISUEL */
.domino-visual {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:16px; padding:20px 24px; margin:16px 0;
  overflow-x:auto;
}
.domino-title { font-family:'Syne',sans-serif; font-size:0.78rem; font-weight:700; color:var(--accent); margin-bottom:16px; text-transform:uppercase; letter-spacing:1px; }
.dominos { display:flex; align-items:flex-end; gap:8px; min-width:max-content; }
.domino {
  width:38px; height:60px; background:linear-gradient(180deg, rgba(91,110,248,0.3), rgba(91,110,248,0.1));
  border:1px solid rgba(91,110,248,0.4); border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-family:'Syne',sans-serif; font-size:0.7rem; font-weight:800; color:var(--accent);
  transition:transform 0.3s; cursor:pointer;
}
.domino:hover { transform:rotate(-15deg) translateY(-10px); }
.domino-arrow { color:var(--accent3); font-size:1.2rem; margin-bottom:18px; }
.domino-label { font-size:0.72rem; color:var(--muted); margin-top:6px; text-align:center; }

/* PROGRESS BAR */
.progress-wrap { margin-bottom:8px; }
.progress-bar { height:3px; background:rgba(255,255,255,0.06); border-radius:3px; overflow:hidden; }
.progress-fill { height:100%; border-radius:3px; background:linear-gradient(90deg,var(--accent),var(--accent3)); transition:width 0.4s ease; }
.progress-text { font-size:0.72rem; color:var(--muted); margin-top:4px; }

/* EXERCICE */
.ex-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:22px; margin:12px 0;
  transition:border-color 0.2s;
}
.ex-card:hover { border-color:rgba(91,110,248,0.2); }
.ex-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.ex-num { font-family:'Syne',sans-serif; font-weight:800; font-size:0.82rem; color:var(--accent); }
.ex-diff { font-size:0.65rem; padding:3px 10px; border-radius:50px; font-weight:800; }
.diff-1 { background:rgba(91,248,196,0.12); color:var(--accent3); }
.diff-2 { background:rgba(248,194,91,0.12); color:var(--gold); }
.diff-3 { background:rgba(248,91,158,0.12); color:var(--accent2); }
.ex-question { color:var(--text); font-size:0.92rem; line-height:1.7; margin-bottom:16px; }
.ex-question p { color:var(--text); margin-bottom:6px; }

.btn-voir {
  background:transparent; border:1px solid var(--border);
  color:var(--muted); padding:7px 18px; border-radius:50px;
  font-family:'DM Sans',sans-serif; font-size:0.8rem; cursor:pointer;
  transition:all 0.2s;
}
.btn-voir:hover { border-color:var(--accent3); color:var(--accent3); }
.btn-voir.open { border-color:var(--accent3); color:var(--accent3); }

.corrige { display:none; margin-top:16px; padding-top:16px; border-top:1px solid var(--border); }
.corrige.show { display:block; }
.corrige-label { font-size:0.65rem; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:var(--accent3); margin-bottom:10px; }
.corrige-body { color:var(--text); font-size:0.9rem; line-height:1.8; }

/* PREMIUM LOCK */
.premium-lock {
  background:linear-gradient(135deg, rgba(248,91,158,0.06), rgba(248,194,91,0.04));
  border:1px dashed rgba(248,194,91,0.3);
  border-radius:16px; padding:32px; text-align:center; margin:12px 0;
}
.lock-icon { font-size:2.5rem; margin-bottom:12px; }
.lock-title { font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem; margin-bottom:8px; }
.lock-desc { color:var(--muted); font-size:0.88rem; margin-bottom:20px; }
.btn-unlock {
  background:linear-gradient(135deg,var(--gold),#f8a25b);
  color:#000; border:none; padding:12px 28px; border-radius:50px;
  font-family:'DM Sans',sans-serif; font-weight:800; font-size:0.9rem;
  cursor:pointer; transition:transform 0.2s, box-shadow 0.2s;
}
.btn-unlock:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(248,194,91,0.35); }

/* FICHE DE RÉVISION */
.fiche-box {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:20px; padding:28px; margin:16px 0;
}
.fiche-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border);
}
.fiche-title { font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem; }
.fiche-badge { font-size:0.65rem; padding:4px 12px; border-radius:50px; background:var(--accent); color:#fff; font-weight:700; }
.fiche-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.fiche-item {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:14px 16px;
}
.fiche-item-label { font-size:0.68rem; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.fiche-item-content { color:var(--text); font-size:0.88rem; line-height:1.7; }

/* SUJET BAC */
.sujet-box {
  background:var(--surface); border:1px solid var(--border);
  border-radius:20px; overflow:hidden; margin:16px 0;
}
.sujet-header {
  background:linear-gradient(135deg, rgba(91,110,248,0.15), rgba(91,248,196,0.08));
  padding:18px 24px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.sujet-meta { display:flex; gap:12px; flex-wrap:wrap; }
.sujet-badge {
  padding:3px 10px; border-radius:50px; font-size:0.65rem;
  font-weight:800; text-transform:uppercase; letter-spacing:0.5px;
}
.sujet-year { background:rgba(91,110,248,0.2); color:var(--accent); }
.sujet-type { background:rgba(91,248,196,0.15); color:var(--accent3); }
.sujet-pts { background:rgba(248,194,91,0.15); color:var(--gold); }
.sujet-title { font-family:'Syne',sans-serif; font-weight:800; font-size:0.95rem; }
.sujet-body { padding:22px 24px; }
.sujet-intro { color:var(--muted); font-size:0.88rem; line-height:1.7; margin-bottom:20px; border-left:3px solid var(--border); padding-left:14px; font-style:italic; }
.sujet-question {
  display:flex; gap:14px; padding:14px 0;
  border-bottom:1px solid var(--border); align-items:flex-start;
}
.sujet-question:last-child { border-bottom:none; padding-bottom:0; }
.q-letter {
  width:32px; height:32px; border-radius:50%; flex-shrink:0;
  background:rgba(91,110,248,0.12); color:var(--accent);
  font-family:'Syne',sans-serif; font-weight:800; font-size:0.8rem;
  display:flex; align-items:center; justify-content:center;
}
.q-content { flex:1; }
.q-text { color:var(--text); font-size:0.9rem; line-height:1.7; margin-bottom:8px; }
.q-pts { font-size:0.7rem; color:var(--muted); }

/* NAV BAS */
.nav-bottom {
  display:flex; justify-content:space-between; margin-top:40px;
  padding-top:24px; border-top:1px solid var(--border);
}
.btn-nav {
  display:flex; align-items:center; gap:8px;
  padding:11px 22px; border-radius:50px;
  border:1px solid var(--border); background:transparent;
  color:var(--text); font-family:'DM Sans',sans-serif;
  font-size:0.88rem; font-weight:500; cursor:pointer; transition:all 0.2s;
  text-decoration:none;
}
.btn-nav:hover { border-color:var(--accent); background:rgba(91,110,248,0.08); }
.btn-nav.primary {
  background:var(--accent); border-color:var(--accent);
  box-shadow:0 4px 20px rgba(91,110,248,0.3);
}
.btn-nav.primary:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(91,110,248,0.5); }
.btn-nav:disabled { opacity:0.3; cursor:default; pointer-events:none; }

/* MENU MOBILE */
.mobile-chapters {
  display:none;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0 16px 12px;
  overflow-x:auto;
  white-space:nowrap;
  -webkit-overflow-scrolling:touch;
  position:sticky; top:70px; z-index:50;
}
.mobile-chapters::-webkit-scrollbar { display:none; }
.mobile-chapters-title {
  font-size:0.65rem; font-weight:700; letter-spacing:2px;
  text-transform:uppercase; color:var(--muted);
  padding:10px 0 8px; display:block;
}
.mobile-ch-group { display:inline-flex; gap:8px; margin-right:16px; }
.mobile-ch-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 14px; border-radius:50px;
  border:1px solid var(--border); background:transparent;
  color:var(--muted); font-family:'DM Sans',sans-serif;
  font-size:0.78rem; font-weight:600; cursor:pointer;
  transition:all 0.2s; white-space:nowrap; flex-shrink:0;
}
.mobile-ch-btn:hover { border-color:var(--accent); color:var(--text); }
.mobile-ch-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.mobile-group-label {
  display:inline-flex; align-items:center;
  font-size:0.6rem; font-weight:800; text-transform:uppercase;
  letter-spacing:1px; color:var(--muted); margin-right:4px;
  padding:3px 8px; border-radius:50px;
  background:rgba(255,255,255,0.04);
}

<div class="section">
  <div class="section-title">Le nombre dérivé en un point</div>
  <div class="def-box">
    <div class="def-label">📖 Définition</div>
    <div class="def-body">
      Le <strong>nombre dérivé</strong> de \\(f\\) en \\(a\\), noté \\(f'(a)\\), est la limite (si elle existe) du <em>taux d'accroissement</em> de \\(f\\) en \\(a\\) :
    </div>
  </div>
  <div class="formule-box">
    <div class="formule-label">Définition par la limite</div>
    <div class="formule-body">\\[f'(a) = \\lim_{h \\to 0} \\frac{f(a+h) - f(a)}{h}\\]</div>
  </div>
  <p><strong>Interprétation géométrique :</strong> \\(f'(a)\\) est le <em>coefficient directeur de la tangente</em> à la courbe au point \\(A(a ; f(a))\\).</p>
  <div class="formule-box">
    <div class="formule-label">Équation de la tangente en a</div>
    <div class="formule-body">\\[y = f'(a)(x - a) + f(a)\\]</div>
  </div>
  <div class="exemple-box">
    <div class="exemple-label">📘 Exemple — Calculer \\(f'(3)\\) pour \\(f(x) = x^2\\)</div>
    <div class="exemple-steps">
      <div class="step"><div class="step-num">1</div><div>\\(f(3+h) = (3+h)^2 = 9 + 6h + h^2\\)</div></div>
      <div class="step"><div class="step-num">2</div><div>\\(\\dfrac{f(3+h)-f(3)}{h} = \\dfrac{9+6h+h^2-9}{h} = \\dfrac{6h+h^2}{h} = 6+h\\)</div></div>
      <div class="step"><div class="step-num">3</div><div>\\(\\lim_{h\\to0}(6+h) = 6\\) donc \\(f'(3) = 6\\)</div></div>
    </div>
  </div>
</div>`,

<div class="section">
  <div class="section-title">Dérivées usuelles</div>
  <div class="formule-box">
    <div class="formule-label">Tableau des dérivées fondamentales</div>
    <div class="formule-body">
      \\(f(x) = k \\Rightarrow f'(x) = 0\\)<br>
      \\(f(x) = x^n \\Rightarrow f'(x) = n x^{n-1}\\)<br>
      \\(f(x) = \\sqrt{x} \\Rightarrow f'(x) = \\dfrac{1}{2\\sqrt{x}}\\)<br>
      \\(f(x) = \\dfrac{1}{x} \\Rightarrow f'(x) = -\\dfrac{1}{x^2}\\)<br>
      \\(f(x) = e^x \\Rightarrow f'(x) = e^x\\)<br>
      \\(f(x) = \\ln x \\Rightarrow f'(x) = \\dfrac{1}{x}\\)
    </div>
  </div>
  <div class="formule-box">
    <div class="formule-label">Règles opératoires</div>
    <div class="formule-body">
      \\((u+v)' = u' + v'\\)<br>
      \\((ku)' = k u'\\)<br>
      \\((uv)' = u'v + uv'\\)<br>
      \\(\\left(\\dfrac{u}{v}\\right)' = \\dfrac{u'v - uv'}{v^2}\\)<br>
      \\((u \\circ v)' = v' \\cdot u'(v)\\) (dérivée composée)
    </div>
  </div>
  <div class="exemple-box">
    <div class="exemple-label">📘 Exemple — Dériver \\(f(x) = x^3 - 3x^2 + 2x - 5\\)</div>

      <div class="step"><div class="step-num">3</div><div>\\((2x)' = 2\\) &ensp; \\((-5)' = 0\\)</div></div>
      <div class="step"><div class="step-num">4</div><div>\\(f'(x) = 3x^2 - 6x + 2\\)</div></div>
    </div>
  </div>
</div>`,

    </div>
  </div>

    1:`<div class="section"><div class="section-title">Réciproque du théorème de Pythagore</div>

probas:{
  emoji:'🎲', titre:'Probabilités & Statistiques', niveau:'Collège', classe:'3e',

    0:`<div class="section"><div class="section-title">Vocabulaire et définitions</div>
<div class="def-box"><div class="def-label">📖 Définitions</div><div class="def-body"><strong>Expérience aléatoire</strong> : expérience dont on ne peut prédire le résultat.<br><strong>Univers \\(\\Omega\\)</strong> : ensemble de tous les issues possibles.<br><strong>Événement</strong> : sous-ensemble de \\(\\Omega\\).</div></div>
<div class="formule-box"><div class="formule-label">Probabilité d'un événement équiprobable</div><div class="formule-body">\\[P(A) = \\frac{\\text{nombre de cas favorables à } A}{\\text{nombre total de cas}} \\qquad 0 \\leq P(A) \\leq 1\\]</div></div>
<div class="formule-box"><div class="formule-label">Propriétés fondamentales</div><div class="formule-body">\\(P(\\Omega) = 1\\) &ensp; \\(P(\\emptyset) = 0\\) &ensp; \\(P(\\bar{A}) = 1 - P(A)\\)<br>\\(P(A \\cup B) = P(A) + P(B) - P(A \\cap B)\\)</div></div></div>`,
    1:`<div class="section"><div class="section-title">Statistiques descriptives</div>
<div class="formule-box"><div class="formule-label">Indicateurs de centralité et de dispersion</div><div class="formule-body">\\(\\bar{x} = \\dfrac{\\sum x_i \\cdot n_i}{N}\\) (moyenne pondérée)<br><br>Médiane : valeur centrale qui partage en deux moitiés égales<br><br>Étendue \\(= x_{max} - x_{min}\\)</div></div>
<div class="exemple-box"><div class="exemple-label">📘 Exemple — Notes : 8, 12, 14, 10, 16</div><div class="exemple-steps"><div class="step"><div class="step-num">1</div><div>Moyenne : \\(\\bar{x} = \\dfrac{8+12+14+10+16}{5} = 12\\)</div></div><div class="step"><div class="step-num">2</div><div>Ordre : 8, 10, 12, 14, 16 → Médiane = 12</div></div><div class="step"><div class="step-num">3</div><div>Étendue = 16 - 8 = 8</div></div></div></div></div>`,
    2:`<div class="section"><div class="section-title">Loi des grands nombres & fluctuation</div>
<div class="theoreme-box"><div class="theoreme-label">📊 Loi des grands nombres</div><div class="theoreme-body">Quand on répète une expérience aléatoire un grand nombre de fois, la <strong>fréquence</strong> observée d'un événement se rapproche de sa <strong>probabilité théorique</strong>.</div></div>
<div class="formule-box"><div class="formule-label">Intervalle de fluctuation (au seuil 95%)</div><div class="formule-body">\\[\\left[ p - \\frac{1}{\\sqrt{n}} \\;;\; p + \\frac{1}{\\sqrt{n}} \\right]\\]</div></div></div>`
  },
  exercices:[

    { num:'2', diff:1, label:'Facile', q:`On tire une carte dans un jeu de 52. Probabilité d'obtenir un as ?`, r:`\\(P = \\dfrac{4}{52} = \\dfrac{1}{13}\\)` },

    { num:'4', diff:2, label:'Moyen', q:`Une urne contient 3 boules rouges et 5 boules bleues. On tire une boule. Quelle est la probabilité de tirer rouge ?`, r:`\\(P(R) = \\dfrac{3}{8}\\)` },

    { num:'6', diff:2, label:'Moyen', q:`Un sac contient 4 billes vertes, 3 rouges et 5 bleues. Quelle est la probabilité de ne pas tirer de bille rouge ?`, r:`\\(P(\\bar{R}) = 1 - \\dfrac{3}{12} = \\dfrac{3}{4}\\)` },
    { num:'7', diff:2, label:'Moyen', q:`Calcule la moyenne et la médiane : 5, 8, 6, 12, 9, 7, 11.`, r:`Moyenne \\(= \\dfrac{58}{7} \\approx 8{,}3\\)<br>Ordre : 5,6,7,8,9,11,12 → Médiane = 8` },
    { num:'8', diff:3, label:'Difficile', q:`On tire successivement 2 cartes sans remise. Probabilité que les deux soient des cœurs ?`, r:`\\(P = \\dfrac{13}{52} \\times \\dfrac{12}{51} = \\dfrac{156}{2652} = \\dfrac{1}{17}\\)` },
    { num:'9', diff:3, label:'Difficile', q:`On fait 100 lancers de pièce. Donne l'intervalle de fluctuation de la fréquence "pile".`, r:`\\(p=0{,}5\\), \\(n=100\\) : \\(\\left[0{,}5-0{,}1 ; 0{,}5+0{,}1\\right] = [0{,}4 ; 0{,}6]\\)` },
    { num:'10', diff:3, label:'Difficile', q:`Dans une classe de 30 élèves, 18 ont eu plus de 10. Si on choisit 2 élèves au hasard, quelle est la probabilité que les deux aient eu plus de 10 ?`, r:`\\(P = \\dfrac{18}{30} \\times \\dfrac{17}{29} = \\dfrac{306}{870} = \\dfrac{51}{145}\\)` },

    { num:'B7', diff:2, label:'Bonus', q:`Sur 400 lancers d'une pièce, on obtient 186 "pile". Ce résultat est-il compatible avec \\(p=0{,}5\\) au seuil 95% ?`, r:`Intervalle : \\([0{,}5-0{,}05 ; 0{,}5+0{,}05]=[0{,}45;0{,}55]\\). Fréquence : \\(\\dfrac{186}{400}=0{,}465 \\in [0{,}45;0{,}55]\\) → compatible` },
    { num:'B8', diff:3, label:'Bonus', q:`Combien faut-il de personnes pour que la probabilité qu'au moins deux aient le même anniversaire dépasse 50% ? (Paradoxe des anniversaires)`, r:`Il faut seulement <strong>23 personnes</strong>. \\(P(\\text{tous diff.}) = \\dfrac{365!}{(365-n)! \\cdot 365^n}\\) < 0,5 pour \\(n=23\\)` },
    { num:'B9', diff:3, label:'Bonus', q:`Espérance de vie simulée : sur 500 individus, la survie à 70 ans est de 62%. Intervalle de fluctuation ?`, r:`\\(p=0{,}62, n=500\\) : \\(IF = \\left[0{,}62 - \\dfrac{1}{\\sqrt{500}} ; 0{,}62+\\dfrac{1}{\\sqrt{500}}\\right] \\approx [0{,}575 ; 0{,}665]\\)` },
    { num:'B10', diff:3, label:'Bonus', q:`Démontre la formule \\(P(A\\cup B) = P(A)+P(B)-P(A\\cap B)\\) à partir des axiomes de Kolmogorov.`, r:`\\(A\\cup B = A \\cup (B\\setminus A)\\) (réunion disjointe)<br>\\(P(A\\cup B) = P(A)+P(B\\setminus A)\\)<br>Or \\(B = (B\\cap A)\\cup(B\\setminus A)\\) disjoints, donc \\(P(B\\setminus A)=P(B)-P(A\\cap B)\\)<br>D'où \\(P(A\\cup B)=P(A)+P(B)-P(A\\cap B)\\)` },

suites:{
  emoji:'∑', titre:'Suites numériques', niveau:'Lycée', classe:'Terminale',
  desc:'Suites arithmétiques, géométriques, raisonnement par récurrence.',

  lecons:{
    0:`<div class="section"><div class="section-title">Définitions</div>
<div class="def-box"><div class="def-label">📖 Définition</div><div class="def-body">Une <strong>suite numérique</strong> est une fonction de \\(\\mathbb{N}\\) (ou d'une partie) dans \\(\\mathbb{R}\\). On note ses termes \\((u_n)_{n \\in \\mathbb{N}}\\).</div></div>
<div class="formule-box"><div class="formule-label">Deux types de définition</div><div class="formule-body">Terme général : \\(u_n = f(n)\\) (formule explicite)<br>Récurrence : \\(u_{n+1} = g(u_n)\\) avec \\(u_0\\) donné</div></div>
<p>Une suite est <strong>croissante</strong> si \\(u_{n+1} > u_n\\) pour tout \\(n\\).</p></div>`,
    1:`<div class="section"><div class="section-title">Suites arithmétiques</div>
<div class="def-box"><div class="def-label">📖 Définition</div><div class="def-body">Suite arithmétique de premier terme \\(u_0\\) et de raison \\(r\\) : chaque terme s'obtient en <strong>ajoutant</strong> \\(r\\) au précédent.</div></div>
<div class="formule-box"><div class="formule-label">Formules clés</div><div class="formule-body">\\(u_n = u_0 + nr\\)<br>\\(S_n = \\displaystyle\\sum_{k=0}^{n} u_k = (n+1)\\cdot\\dfrac{u_0+u_n}{2}\\)</div></div>
<div class="exemple-box"><div class="exemple-label">📘 Suite : \\(u_0 = 3\\), \\(r = 5\\)</div><div class="exemple-steps"><div class="step"><div class="step-num">1</div><div>\\(u_1=8,\\; u_2=13,\\; u_3=18, \\ldots\\)</div></div><div class="step"><div class="step-num">2</div><div>\\(u_n = 3 + 5n\\)</div></div><div class="step"><div class="step-num">3</div><div>\\(S_4 = \\dfrac{5(u_0+u_4)}{1} = \\ldots\\) (calculer)</div></div></div></div></div>`,
    2:`<div class="section"><div class="section-title">Suites géométriques & Récurrence</div>
<div class="formule-box"><div class="formule-label">Suite géométrique de raison q</div><div class="formule-body">\\(u_n = u_0 \\cdot q^n\\)<br>\\(S_n = u_0 \\cdot \\dfrac{1-q^{n+1}}{1-q}\\) si \\(q \\neq 1\\)</div></div>
<div class="domino-visual">
  <div class="domino-title">🃏 Analogie des dominos — Récurrence</div>
  <div class="dominos">
    <div style="text-align:center"><div class="domino">P(0)</div><div class="domino-label">Initialisation<br>vérifier P(0)</div></div>
    <div class="domino-arrow">→</div>
    <div style="text-align:center"><div class="domino">P(n)</div><div class="domino-label">Hypothèse<br>supposer P(n)</div></div>
    <div class="domino-arrow">→</div>
    <div style="text-align:center"><div class="domino">P(n+1)</div><div class="domino-label">Hérédité<br>démontrer P(n+1)</div></div>
    <div class="domino-arrow">→</div>
    <div style="text-align:center"><div class="domino" style="background:linear-gradient(180deg,rgba(91,248,196,0.3),rgba(91,248,196,0.1));border-color:rgba(91,248,196,0.4);color:var(--accent3)">∀n</div><div class="domino-label">Conclusion<br>vrai pour tout n</div></div>
  </div>
</div>
<div class="astuce-box"><div class="astuce-icon">🎯</div><div class="astuce-content"><div class="astuce-title">Méthode de récurrence en 3 étapes</div><div class="astuce-text">1. <strong>Initialisation</strong> : vérifier pour \\(n=0\\) (ou \\(n=1\\))<br>2. <strong>Hérédité</strong> : supposer vrai pour \\(n\\), démontrer pour \\(n+1\\)<br>3. <strong>Conclusion</strong> : "Par le principe de récurrence, P(n) est vraie pour tout \\(n \\in \\mathbb{N}\\)"</div></div></div></div>`

<div class="def-box"><div class="def-label">📖 Définition</div><div class="def-body">La suite \\((u_n)\\) a pour limite \\(l \\in \\mathbb{R}\\) si \\(u_n\\) se rapproche arbitrairement de \\(l\\) quand \\(n \\to +\\infty\\). On note \\(\\lim_{n\\to+\\infty}u_n = l\\).</div></div>
<div class="formule-box"><div class="formule-label">Limites usuelles</div><div class="formule-body">\\(\\lim_{n\\to+\\infty} n^p = +\\infty\\) (pour \\(p>0\\))<br>\\(\\lim_{n\\to+\\infty} q^n = 0\\) si \\(|q|<1\\)<br>\\(\\lim_{n\\to+\\infty} q^n = +\\infty\\) si \\(q>1\\)</div></div></div>`,
    1:`<div class="section"><div class="section-title">Limites de fonctions</div>
<div class="formule-box"><div class="formule-label">Opérations sur les limites</div><div class="formule-body">Si \\(\\lim f = l\\) et \\(\\lim g = m\\) :<br>\\(\\lim(f+g)=l+m\\) &emsp; \\(\\lim(fg)=lm\\)<br>\\(\\lim\\dfrac{f}{g}=\\dfrac{l}{m}\\) si \\(m\\neq0\\)</div></div>
<div class="astuce-box"><div class="astuce-icon">⚠️</div><div class="astuce-content"><div class="astuce-title">Formes indéterminées</div><div class="astuce-text">\\(\\dfrac{\\infty}{\\infty}\\), \\(\\infty - \\infty\\), \\(0 \\times \\infty\\), \\(\\dfrac{0}{0}\\) : on doit lever l'indétermination (factoriser, taux d'accroissement...)</div></div></div></div>`,
    2:`<div class="section"><div class="section-title">Continuité et TVI</div>
<div class="theoreme-box"><div class="theoreme-label">📐 Théorème des Valeurs Intermédiaires</div><div class="theoreme-body">Si \\(f\\) est <strong>continue</strong> sur \\([a;b]\\) et si \\(k\\) est un réel compris entre \\(f(a)\\) et \\(f(b)\\), alors il existe au moins un réel \\(c \\in ]a;b[\\) tel que \\(f(c) = k\\).</div></div>

    intro:`Soit \\(f(x) = x^3 - 3x + 1\\).`,
    questions:[
      { letter:'a', text:`Calcule \\(f'(x)\\) et étudie ses variations.`, pts:'3 pts', r:`\\(f'(x)=3x^2-3=3(x-1)(x+1)\\). Max en \\(-1\\) : \\(f(-1)=3\\). Min en \\(1\\) : \\(f(1)=-1\\)` },
      { letter:'b', text:`Démontre que l'équation \\(f(x)=0\\) a exactement 3 solutions réelles.`, pts:'3 pts', r:`\\(f(-2)=-1<0\\), \\(f(-1)=3>0\\) → racine dans \\(]-2;-1[\\)<br>\\(f(0)=1>0\\), \\(f(1)=-1<0\\) → racine dans \\(]0;1[\\)<br>\\(f(1)=-1<0\\), \\(f(2)=3>0\\) → racine dans \\(]1;2[\\)` },
      { letter:'c', text:`Donne un encadrement de chaque racine à \\(0{,}1\\) près.`, pts:'3 pts', r:`Par dichotomie ou calculatrice : \\(x_1\\approx-1{,}88\\), \\(x_2\\approx0{,}35\\), \\(x_3\\approx1{,}53\\)` },
    ]}]
}

}; // fin CHAPTERS

// ═══════════════════════════════════
// ÉTAT
// ═══════════════════════════════════
let current = { chapter:'fractions', tab:'cours', lecon:0 };

// ═══════════════════════════════════
// RENDU
// ═══════════════════════════════════
function loadChapterMobile(id, btn) {
  current.chapter = id;
  current.lecon = 0;
  current.tab = 'cours';
  // Mettre à jour boutons mobile
  document.querySelectorAll('.mobile-ch-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  // Mettre à jour sidebar
  document.querySelectorAll('.sb-item').forEach(b => b.classList.remove('active'));
  document.querySelector(`.sb-item[onclick*="${id}"]`)?.classList.add('active');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function loadChapter(id, event) {
  current.chapter = id;
  current.lecon = 0;
  current.tab = 'cours';
  document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('active'));
  if (event) event.currentTarget.classList.add('active');
  else document.querySelector(`.sb-item[onclick*="${id}"]`)?.classList.add('active');
  render();
}

function render() {
  const ch = CHAPTERS[current.chapter];
  if (!ch) return;
  const mainEl = document.getElementById('mainContent');

  mainEl.innerHTML = `
    <div class="ch-header">
      <div class="ch-top">
        <span class="ch-emoji">${ch.emoji}</span>
        <div class="ch-meta">
          <div class="ch-tags">
            <span class="tag tag-maths">Maths</span>
            <span class="tag ${ch.niveau === 'Collège' ? 'tag-col' : 'tag-lyc'}">${ch.niveau}</span>
            <span class="tag tag-col">${ch.classe}</span>
          </div>
          <div class="ch-titre">${ch.titre}</div>
          <div class="ch-desc">${ch.desc}</div>
        </div>
      </div>
      <div class="ch-stats">
        <span class="ch-stat">🕐 ${ch.duree}</span>
        <span class="ch-stat">📚 ${ch.chapitres.length} chapitres</span>
        <span class="ch-stat">✏️ 10 exercices</span>
        <span class="ch-stat">⭐ 10 exercices bonus</span>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn ${current.tab==='cours'?'active':''}" onclick="switchTab('cours')">📖 Cours</button>
      <button class="tab-btn ${current.tab==='exercices'?'active':''}" onclick="switchTab('exercices')">✏️ Exercices</button>
      <button class="tab-btn ${current.tab==='bonus'?'active':''}" onclick="switchTab('bonus')">⭐ Bonus</button>
      <button class="tab-btn ${current.tab==='fiche'?'active':''}" onclick="switchTab('fiche')">📋 Fiche</button>
      <button class="tab-btn ${current.tab==='sujets'?'active':''}" onclick="switchTab('sujets')">🎓 Sujets</button>
    </div>

    <div class="tab-panel ${current.tab==='cours'?'active':''}" id="tab-cours">${renderCours(ch)}</div>
    <div class="tab-panel ${current.tab==='exercices'?'active':''}" id="tab-exercices">${renderExercices(ch)}</div>
    <div class="tab-panel ${current.tab==='bonus'?'active':''}" id="tab-bonus">${renderBonus(ch)}</div>
    <div class="tab-panel ${current.tab==='fiche'?'active':''}" id="tab-fiche">${ch.fiche || ''}</div>
    <div class="tab-panel ${current.tab==='sujets'?'active':''}" id="tab-sujets">${renderSujets(ch)}</div>
  `;

  typeset();
}

function renderCours(ch) {
  const lecons = ch.lecons || {};
  const content = lecons[current.lecon] || '<p style="color:var(--muted)">Contenu en cours de rédaction.</p>';
  const pills = ch.chapitres.map((l, i) =>
    `<button class="lecon-pill ${i===current.lecon?'active':''}" onclick="switchLecon(${i})">
      <span class="pill-num">${i+1}</span>${l}
    </button>`
  ).join('');

  const progress = Math.round(((current.lecon+1)/ch.chapitres.length)*100);

  return `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="progress-text">Leçon ${current.lecon+1} / ${ch.chapitres.length}</div>
    </div>
    <div class="lecons-nav">${pills}</div>
    <div id="lecon-body">${content}</div>
    <div class="nav-bottom">
      <button class="btn-nav" onclick="switchLecon(${current.lecon-1})" ${current.lecon===0?'disabled':''}>← Précédent</button>
      <button class="btn-nav primary" onclick="switchLecon(${current.lecon+1})" ${current.lecon===ch.chapitres.length-1?'disabled':''}>Suivant →</button>
    </div>
  `;
}

function renderExercices(ch) {
  if (!ch.exercices) return '<p>Exercices en cours de rédaction.</p>';
  return ch.exercices.map(ex => `
    <div class="ex-card">
      <div class="ex-header">
        <span class="ex-num">Exercice ${ex.num}</span>
        <span class="ex-diff diff-${ex.diff}">${ex.label}</span>
      </div>
      <div class="ex-question">${ex.q}</div>
      <button class="btn-voir" onclick="toggleCorrige(this)">Voir le corrigé</button>
      <div class="corrige">
        <div class="corrige-label">✓ Corrigé</div>
        <div class="corrige-body">${ex.r}</div>
      </div>
    </div>
  `).join('');
}

function renderBonus(ch) {
  if (!ch.bonus) return '<p>Exercices bonus en cours de rédaction.</p>';
  const lockAfter = 5;
  return ch.bonus.map((ex, idx) => {
    if (idx >= lockAfter) {
      return `
        <div class="premium-lock">
          <div class="lock-icon">🔒</div>
          <div class="lock-title">Exercice Bonus ${ex.num} — Réservé aux membres Premium</div>
          <div class="lock-desc">Débloque tous les exercices bonus, les corrigés détaillés et les sujets de bac.</div>
          <button class="btn-unlock" onclick="window.location='index.html#tarifs'">✦ Passer au Premium — 10€/mois</button>
        </div>`;
    }
    return `
      <div class="ex-card">
        <div class="ex-header">
          <span class="ex-num" style="color:var(--gold)">Bonus ${ex.num}</span>
          <span class="ex-diff diff-${ex.diff}">${ex.label}</span>
        </div>
        <div class="ex-question">${ex.q}</div>
        <button class="btn-voir" onclick="toggleCorrige(this)">Voir le corrigé</button>
        <div class="corrige">
          <div class="corrige-label">✓ Corrigé</div>
          <div class="corrige-body">${ex.r}</div>
        </div>
      </div>`;
  }).join('');
}

function renderSujets(ch) {
  if (!ch.sujets || !ch.sujets.length) return '<p style="color:var(--muted)">Sujets en cours d\'ajout.</p>';
  return ch.sujets.map(s => `
    <div class="sujet-box">
      <div class="sujet-header">
        <div class="sujet-meta">
          <span class="sujet-badge sujet-year">${s.annee}</span>
          <span class="sujet-badge sujet-type">${s.type}</span>
          <span class="sujet-badge sujet-pts">${s.pts}</span>
        </div>
        <div class="sujet-title">${s.titre}</div>
      </div>
      <div class="sujet-body">
        <div class="sujet-intro">${s.intro}</div>
        ${s.questions.map(q => `
          <div class="sujet-question">
            <div class="q-letter">${q.letter}</div>
            <div class="q-content">
              <div class="q-text">${q.text}</div>
              <div class="q-pts">${q.pts}</div>
              <button class="btn-voir" style="margin-top:10px" onclick="toggleCorrige(this)">Voir le corrigé</button>
              <div class="corrige"><div class="corrige-label">✓ Corrigé</div><div class="corrige-body">${q.r}</div></div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function switchTab(tab) {
  current.tab = tab;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    const tabs = ['cours','exercices','bonus','fiche','sujets'];
    btn.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('tab-' + tab);
  if (panel) { panel.classList.add('active'); }
  typeset();
}

function switchLecon(idx) {
  const ch = CHAPTERS[current.chapter];
  if (idx < 0 || idx >= ch.chapitres.length) return;
  current.lecon = idx;
  const coursPanel = document.getElementById('tab-cours');
  if (coursPanel) { coursPanel.innerHTML = renderCours(ch); typeset(); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleCorrige(btn) {
  const c = btn.nextElementSibling;
  c.classList.toggle('show');
  btn.textContent = c.classList.contains('show') ? 'Masquer le corrigé' : 'Voir le corrigé';
  btn.classList.toggle('open');
  if (c.classList.contains('show')) typeset();
}

function typeset() {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise().catch(err => console.log(err));
  }
}

// Init

// ─── Lire les paramètres URL pour ouvrir directement le bon chapitre/leçon ───
const _urlP = new URLSearchParams(window.location.search);
const _chap = _urlP.get('chapitre');
const _lecon = _urlP.get('lecon');
if (_chap && CHAPTERS[_chap]) {
  current.chapter = _chap;
  current.lecon = _lecon ? parseInt(_lecon) : 0;
}
document.querySelectorAll('.sb-item').forEach(b => b.classList.remove('active'));
document.querySelector(`.sb-item[onclick*="${current.chapter}"]`)?.classList.add('active');
render();
</script>
</body>
</html>
