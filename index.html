<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>EDUCX — Cours Complets Maths & Physique-Chimie</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        // Configuration MathJax pour un rendu parfait des formules
        MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']],
                packages: { '[+]': ['ams'] }
            },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] },
            startup: { typeset: false }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script"></script>
    <style>
        /* ========== VARIABLES & RESET ========== */
        :root {
            --bg: #07080f;
            --surface: #0f1120;
            --surface2: #171929;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #5b6ef8;
            --accent2: #f85b9e;
            --accent3: #5bf8c4;
            --gold: #f8c25b;
            --text: #e8eaf6;
            --muted: #6b7280;
            --radius: 16px;
            --phys: #f85b9e;
            --chim: #5bf8c4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            line-height: 1.6;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
            opacity: 0.4;
        }
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.12;
        }
        .blob-1 { width: 600px; height: 600px; background: var(--phys); top: -200px; left: -200px; }
        .blob-2 { width: 500px; height: 500px; background: var(--chim); bottom: -150px; right: -150px; }
        .blob-3 { width: 400px; height: 400px; background: var(--accent); top: 40%; left: 40%; }

        /* ========== NAVIGATION ========== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0 32px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(7, 8, 15, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            background: linear-gradient(135deg, var(--accent), var(--accent3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            cursor: pointer;
        }
        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        .nav-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
            cursor: pointer;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--text);
        }
        .premium-badge {
            background: linear-gradient(135deg, var(--gold), #f8a25b);
            color: #000;
            padding: 7px 18px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .premium-badge:hover { transform: translateY(-1px); }

        /* ========== LAYOUT PRINCIPAL ========== */
        .app-container {
            display: flex;
            min-height: 100vh;
            padding-top: 70px;
        }
        /* SIDEBAR */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            height: calc(100vh - 70px);
            position: sticky;
            top: 70px;
            overflow-y: auto;
            padding: 20px 0;
            z-index: 10;
        }
        .sidebar-header { padding: 0 20px 16px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
        .sidebar-title { font-family: 'Syne', sans-serif; font-size: 0.7rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }
        .sb-group-title {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--muted);
            padding: 10px 20px 4px;
        }
        .sb-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 20px;
            cursor: pointer;
            transition: background 0.15s;
            border-left: 3px solid transparent;
            font-size: 0.84rem;
            font-weight: 500;
        }
        .sb-item:hover { background: rgba(91, 110, 248, 0.07); color: var(--text); }
        .sb-item.active { background: rgba(91, 110, 248, 0.12); border-left-color: var(--accent); color: var(--accent); }
        .sb-item .icon { font-size: 1.1rem; flex-shrink: 0; width: 22px; text-align: center; }
        .sb-item .name { flex: 1; }
        .sb-badge {
            font-size: 0.6rem;
            padding: 2px 7px;
            border-radius: 50px;
            font-weight: 800;
            flex-shrink: 0;
        }
        .sb-badge.col { background: rgba(248, 194, 91, 0.15); color: var(--gold); }
        .sb-badge.lyc { background: rgba(180, 91, 248, 0.15); color: #b45bf8; }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            padding: 36px 40px;
            max-width: 1000px;
            position: relative;
            z-index: 1;
        }

        /* ========== COMPOSANTS UI ========== */
        .ch-header {
            background: linear-gradient(135deg, rgba(91, 110, 248, 0.12), rgba(91, 248, 196, 0.06));
            border: 1px solid rgba(91, 110, 248, 0.2);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 32px;
        }
        .ch-top { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 16px; }
        .ch-emoji { font-size: 3rem; line-height: 1; }
        .ch-tags { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .tag {
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        .tag-maths { background: rgba(91, 110, 248, 0.15); color: var(--accent); }
        .tag-phys { background: rgba(248, 91, 158, 0.15); color: var(--phys); }
        .tag-chim { background: rgba(91, 248, 196, 0.15); color: var(--chim); }
        .ch-titre { font-family: 'Syne', sans-serif; font-size: 1.9rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
        .ch-desc { color: var(--muted); font-size: 0.95rem; }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 28px;
            background: var(--surface);
            border-radius: 12px;
            padding: 4px;
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            padding: 9px 12px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active { background: var(--accent); color: #fff; }
        .lecons-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .lecon-pill {
            padding: 7px 16px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lecon-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .def-box {
            background: rgba(91, 110, 248, 0.06);
            border: 1px solid rgba(91, 110, 248, 0.25);
            border-radius: 16px;
            padding: 20px 24px;
            margin: 16px 0;
        }
        .def-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent);
            color: #fff;
            font-size: 0.62rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 50px;
            margin-bottom: 12px;
        }
        .formule-box {
            background: var(--surface2);
            border-left: 4px solid var(--accent);
            border-radius: 0 16px 16px 0;
            padding: 18px 22px;
            margin: 16px 0;
        }
        .exemple-box {
            background: rgba(91, 248, 196, 0.04);
            border: 1px solid rgba(91, 248, 196, 0.18);
            border-radius: 16px;
            padding: 20px 24px;
            margin: 16px 0;
        }
        .ex-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            margin: 12px 0;
        }
        .btn-voir {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 7px 18px;
            border-radius: 50px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .btn-voir:hover { border-color: var(--accent3); color: var(--accent3); }
        .corrige { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
        .corrige.show { display: block; }
        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent3));
            width: 0%;
            transition: width 0.3s;
        }
        .premium-lock {
            background: linear-gradient(135deg, rgba(248, 91, 158, 0.06), rgba(248, 194, 91, 0.04));
            border: 1px dashed rgba(248, 194, 91, 0.3);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
        }
        /* ESPACE PROFIL */
        .profile-card {
            background: var(--surface);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 32px;
        }
        .profile-field {
            margin-bottom: 20px;
        }
        .profile-field label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .profile-field input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
        }
        .btn-save {
            background: var(--accent);
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .progress-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background: var(--surface2);
            border-radius: 16px;
            padding: 16px;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { padding: 20px 16px; }
            .ch-titre { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<nav>
    <div class="logo" onclick="switchView('home')">EDUCX</div>
    <div class="nav-links">
        <div class="nav-link active" id="nav-home" onclick="switchView('home')">Accueil</div>
        <div class="nav-link" id="nav-space" onclick="switchView('space')">Mon espace</div>
        <div class="premium-badge" id="premiumBtn" onclick="activatePremium()">✦ Premium</div>
    </div>
</nav>

<div class="app-container">
    <!-- SIDEBAR (visible en mode cours) -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="sidebar-title">📚 Sommaire</div></div>
        <div id="sidebar-content"></div>
    </aside>

    <main class="main-content" id="mainContent">
        <!-- Contenu dynamique chargé ici -->
        <div style="text-align:center; padding:60px">Chargement de l'espace d'apprentissage...</div>
    </main>
</div>

<script>
    // ==================== DONNEES DES COURS (Maths, Physique, Chimie) ====================
    // Structure pour chaque chapitre : id, titre, niveau, classe, matiere, lecons[], exercices[], videoId, fiche, isPremium (pour les cours experts)
    const COURS_DATA = {
        // MATHS
        maths_fractions: { id: 'maths_fractions', titre: 'Fractions & Opérations', niveau: 'Collège', classe: '5e-4e', matiere: 'maths', videoId: 'Zt7YMzSNes8',
            lecons: [
                { titre: 'Définition et simplification', contenu: `<div class="def-box"><div class="def-label">📖 Définition</div>Une fraction \\(\\frac{a}{b}\\) représente un quotient. Simplifier : diviser numérateur et dénominateur par leur PGCD.</div><div class="exemple-box">Exemple : \\(\\frac{12}{18} = \\frac{2}{3}\\)</div>` },
                { titre: 'Addition et Soustraction', contenu: `<div class="formule-box">\\(\\frac{a}{c} + \\frac{b}{c} = \\frac{a+b}{c}\\)</div><div class="exemple-box">\\(\\frac{1}{2}+\\frac{1}{3} = \\frac{5}{6}\\)</div>` }
            ], exercices: [
                { q: "Simplifie 24/36", r: "2/3" }, { q: "Calcule 1/4 + 1/2", r: "3/4" }
            ], fiche: "Fiche Fractions : addition, multiplication, simplification."
        },
        maths_equations: { id: 'maths_equations', titre: 'Équations du 1er degré', niveau: 'Collège', classe: '4e-3e', matiere: 'maths', videoId: 'p3M3f3OMzVQ',
            lecons: [
                { titre: 'Principe de résolution', contenu: `<div class="def-box">Une équation est une égalité contenant une inconnue. But : isoler x.</div><div class="exemple-box">\\(3x - 5 = 10 \\Rightarrow 3x=15 \\Rightarrow x=5\\)</div>` }
            ], exercices: [ { q: "Résous 2x + 3 = 7", r: "x=2" } ], fiche: "Fiche équations : règle de la balance."
        },
        maths_seconddegre: { id: 'maths_seconddegre', titre: 'Fonctions du second degré', niveau: 'Lycée', classe: '1ère-Tle', matiere: 'maths', videoId: 'cPFV4D_s1G0',
            lecons: [
                { titre: 'Forme canonique et discriminant', contenu: `<div class="formule-box">\\(\\Delta = b^2-4ac\\). Si Δ>0 : deux racines.</div><div class="exemple-box">\\(x^2-5x+6=0\\) → Δ=1 → x=2 ou x=3</div>` }
            ], exercices: [ { q: "Résous x² - 3x + 2 = 0", r: "x=1 ou x=2" } ], fiche: "Fiche second degré : sommet, discriminant."
        },
        // PHYSIQUE
        physique_mecanique: { id: 'physique_mecanique', titre: 'Mécanique - Lois de Newton', niveau: 'Lycée', classe: '2de-Tle', matiere: 'physique', videoId: 'TBBTTt4Hb0U',
            lecons: [
                { titre: 'Les forces et le poids', contenu: `<div class="def-box">Une force modifie le mouvement. Poids : \\(P=mg\\).</div><div class="exemple-box">\\(m=5kg \\Rightarrow P=49N\\)</div>` },
                { titre: '2ème loi de Newton', contenu: `<div class="formule-box">\\(\\sum \\vec{F}=m\\vec{a}\\)</div>` }
            ], exercices: [ { q: "Calcule l'accélération pour F=20N, m=4kg", r: "5 m/s²" } ], fiche: "Fiche Mécanique : poids, inertie."
        },
        physique_electricite: { id: 'physique_electricite', titre: 'Électricité - Loi d\'Ohm', niveau: 'Lycée', classe: '3e-Tle', matiere: 'physique', videoId: 'nJaJxAV20uo',
            lecons: [
                { titre: 'Loi d\'Ohm', contenu: `<div class="formule-box">\\(U = R \\times I\\)</div><div class="exemple-box">R=100Ω, U=12V → I=0.12A</div>` }
            ], exercices: [ { q: "U=10V, R=50Ω, I=?", r: "0.2A" } ], fiche: "Fiche Électricité : résistances série/parallèle."
        },
        // CHIMIE
        chimie_atomes: { id: 'chimie_atomes', titre: 'Atomes et Molécules', niveau: 'Collège', classe: '3e-2nde', matiere: 'chimie', videoId: 'Wb5aKtfmm6I',
            lecons: [
                { titre: 'Structure de l\'atome', contenu: `<div class="def-box">Noyau (protons+neutrons) + électrons. Notation \\(^A_Z X\\).</div><div class="exemple-box">Carbone 12 : 6p,6n,6e</div>` }
            ], exercices: [ { q: "Combien de neutrons dans \\(^{14}_6C\\) ?", r: "8" } ], fiche: "Fiche atomes : isotopes, couches."
        },
        chimie_reactions: { id: 'chimie_reactions', titre: 'Réactions chimiques', niveau: 'Lycée', classe: '1ère-Tle', matiere: 'chimie', videoId: 'q4YdSW3ESIY',
            lecons: [
                { titre: 'Équilibrage et mole', contenu: `<div class="formule-box">\\(n = m/M\\)</div><div class="exemple-box">18g d'eau = 1 mol</div>` }
            ], exercices: [ { q: "Masse molaire de H₂O ?", r: "18 g/mol" } ], fiche: "Fiche réactions : stœchiométrie."
        },
        // COURS EXPERTS PREMIUM (Maths Expertes)
        maths_expert_complexes: { id: 'maths_expert_complexes', titre: 'Nombres Complexes (Expert)', niveau: 'Lycée', classe: 'Terminale Maths Expertes', matiere: 'maths', videoId: '5PzM4fOfcB4', isPremium: true,
            lecons: [
                { titre: 'Forme algébrique', contenu: `<div class="def-box">\\(z = a+ib\\), \\(i^2=-1\\)</div><div class="exemple-box">(3+2i)+(1-4i)=4-2i</div>` }
            ], exercices: [ { q: "Calcule (1+i)²", r: "2i" } ], fiche: "Fiche complexes : conjugué, module."
        },
        physique_quantique: { id: 'physique_quantique', titre: 'Mécanique Quantique (Expert)', niveau: 'Lycée', classe: 'Terminale Physique Expert', matiere: 'physique', videoId: 'T0dQtftkZD0', isPremium: true,
            lecons: [
                { titre: 'Dualité onde-particule', contenu: `<div class="def-box">Relation de de Broglie : \\(\\lambda = h/p\\)</div>` }
            ], exercices: [ { q: "Énergie d'un photon de λ=500nm", r: "3.97e-19 J" } ], fiche: "Fiche quantique : photons, niveaux d'énergie."
        }
    };

    // Liste des chapitres pour le menu
    const chaptersList = [
        { id: 'maths_fraction
