<!DOCTYPE html>
<html lang="fr">
<head>
<!-- Stripe -->
<script src="https://js.stripe.com/v3/"></script>
<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAETqaW3hamdSngwEbQt_d9JctyDtO3ZHU",
    authDomain: "educx-d452f.firebaseapp.com",
    databaseURL: "https://educx-d452f-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "educx-d452f",
    storageBucket: "educx-d452f.firebasestorage.app",
    messagingSenderId: "1033893126346",
    appId: "1:1033893126346:web:7e2513e29d52c16d999433"
  });
  var auth = firebase.auth();
  var dbAuth = firebase.database();

  auth.onAuthStateChanged(function(user) {
    if (user) {
      dbAuth.ref('users/' + user.uid).once('value').then(function(snap) {
        window.currentUser = snap.exists() ? snap.val() : {
          name: user.displayName || user.email.split('@')[0],
          email: user.email, plan: 'gratuit', level: '2nde'
        };
        window.currentUser.email = user.email;
        if (typeof updateNav === 'function') updateNav();
      });
    } else {
      window.currentUser = null;
      if (typeof updateNav === 'function') updateNav();
    }
  });

  function registerFirebase() {
    var name = document.getElementById('reg-name').value.trim();
    var email = document.getElementById('reg-email').value.trim();
    var pass = document.getElementById('reg-pass').value;
    var level = document.getElementById('reg-level').value;
    if (!name || !email || !pass || !level) { showToast('⚠️ Remplis tous les champs !', 2500); return; }
    if (pass.length < 6) { showToast('⚠️ Mot de passe : 6 caractères min', 2500); return; }
    var btn = document.getElementById('btn-register');
    if (btn) { btn.textContent = '⏳ Création…'; btn.disabled = true; }
    auth.createUserWithEmailAndPassword(email, pass)
      .then(function(cred) {
        return cred.user.updateProfile({ displayName: name }).then(function() {
          return dbAuth.ref('users/' + cred.user.uid).set({
            name: name, email: email, level: level,
            plan: window.selectedPlan || 'gratuit',
            createdAt: new Date().toISOString()
          });
        });
      })
      .then(function() {
        showToast('✅ Bienvenue ' + name + ' ! 🎉', 3000);
        if (typeof sendWelcomeEmail === 'function') sendWelcomeEmail(name, email);
        if (window.window.selectedPlan === 'premium') {
          startStripeCheckout(email);
        } else {
          showPage('dashboard');
        }
      })
      .catch(function(e) {
        var msg = e.code === 'auth/email-already-in-use' ? '❌ Email déjà utilisé !' :
                  e.code === 'auth/invalid-email' ? '❌ Email invalide !' : '❌ ' + e.message;
        showToast(msg, 4000);
        if (btn) { btn.textContent = 'Créer mon compte →'; btn.disabled = false; }
      });
  }

  function loginFirebase() {
    var email = document.getElementById('login-email').value.trim();
    var pass = document.getElementById('login-pass').value;
    if (!email || !pass) { showToast('⚠️ Remplis tous les champs !', 2500); return; }
    var btn = document.getElementById('btn-login');
    if (btn) { btn.textContent = '⏳ Connexion…'; btn.disabled = true; }
    auth.signInWithEmailAndPassword(email, pass)
      .then(function() {
        showToast('👋 Bon retour !', 2000);
        setTimeout(function() { showPage('dashboard'); }, 500);
      })
      .catch(function(e) {
        showToast('❌ Email ou mot de passe incorrect', 4000);
        if (btn) { btn.textContent = 'Se connecter →'; btn.disabled = false; }
      });
  }

  function resetPassword() {
    var email = document.getElementById('login-email').value.trim();
    if (!email) { showToast("⚠️ Entre ton email d'abord !", 2500); return; }
    auth.sendPasswordResetEmail(email)
      .then(function() { showToast('📧 Email envoyé à ' + email + ' !', 5000); })
      .catch(function() { showToast('❌ Email introuvable', 3000); });
  }

  function logoutFirebase() {
    auth.signOut().then(function() { showToast('👋 À bientôt !', 2000); showPage('home'); });
  }
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUCX — La Science à ta portée</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080f;
    --surface: #0f1120;
    --surface2: #171929;
    --border: rgba(255,255,255,0.08);
    --accent: #5b6ef8;
    --accent2: #f85b9e;
    --accent3: #5bf8c4;
    --gold: #f8c25b;
    --text: #e8eaf6;
    --muted: #6b7280;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ─── NOISE OVERLAY ─── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: 0.4;
  }

  /* ─── GRADIENT BLOBS ─── */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.18;
  }
  .blob-1 { width: 600px; height: 600px; background: var(--accent); top: -200px; left: -200px; }
  .blob-2 { width: 500px; height: 500px; background: var(--accent2); bottom: -150px; right: -150px; }
  .blob-3 { width: 400px; height: 400px; background: var(--accent3); top: 40%; left: 40%; }

  /* ─── NAV ─── */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 0 40px;
    height: 70px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(7,8,15,0.7);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.6rem;
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    cursor: pointer;
  }

  .nav-links { display: flex; gap: 32px; align-items: center; }
  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: color 0.2s;
    cursor: pointer;
  }
  .nav-links a:hover { color: var(--text); }

  .nav-cta {
    background: var(--accent);
    color: #fff !important;
    padding: 8px 20px;
    border-radius: 50px;
    font-weight: 600 !important;
    transition: transform 0.2s, box-shadow 0.2s !important;
  }
  .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(91,110,248,0.4) !important; }

  .nav-duel {
    background: rgba(248,91,158,0.12);
    color: #f85b9e !important;
    border: 1px solid rgba(248,91,158,0.3);
    padding: 7px 16px;
    border-radius: 50px;
    font-weight: 700 !important;
    font-size: 0.82rem !important;
    text-decoration: none;
    transition: all 0.2s !important;
  }
  .nav-duel:hover { background: rgba(248,91,158,0.22) !important; transform: translateY(-1px) !important; }

  .nav-ia {
    background: rgba(91,248,196,0.12);
    color: #5bf8c4 !important;
    border: 1px solid rgba(91,248,196,0.3);
    padding: 7px 16px;
    border-radius: 50px;
    font-weight: 700 !important;
    font-size: 0.82rem !important;
    text-decoration: none;
    transition: all 0.2s !important;
  }
  .nav-ia:hover { background: rgba(91,248,196,0.22) !important; transform: translateY(-1px) !important; }

  /* ─── PAGES ─── */
  .page { display: none; position: relative; z-index: 1; }
  .page.active { display: block; }

  /* ─── HERO ─── */
  #home {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 100px 24px 60px;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 16px;
    border: 1px solid rgba(91,248,196,0.3);
    border-radius: 50px;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--accent3);
    margin-bottom: 32px;
    background: rgba(91,248,196,0.06);
    animation: fadeUp 0.6s ease both;
  }
  .badge::before { content: '✦'; }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2.8rem, 7vw, 5.5rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 24px;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  h1 span.grad {
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 50%, var(--accent3) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-sub {
    max-width: 580px;
    color: var(--muted);
    font-size: 1.1rem;
    margin: 0 auto 44px;
    line-height: 1.7;
    animation: fadeUp 0.6s 0.2s ease both;
  }

  .hero-btns {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    animation: fadeUp 0.6s 0.3s ease both;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    color: #fff;
    border: none;
    padding: 14px 32px;
    border-radius: 50px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(91,110,248,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(91,110,248,0.5); }

  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 14px 32px;
    border-radius: 50px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .btn-ghost:hover { border-color: var(--accent); background: rgba(91,110,248,0.08); }

  /* ─── STATS BAR ─── */
  .stats-bar {
    display: flex; gap: 48px; flex-wrap: wrap;
    justify-content: center;
    padding: 40px 24px 0;
    animation: fadeUp 0.6s 0.4s ease both;
  }
  .stat { text-align: center; }
  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: var(--text);
  }
  .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

  /* ─── SUBJECTS ─── */
  .section {
    max-width: 1100px;
    margin: 0 auto;
    padding: 80px 24px;
  }

  .section-label {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 48px;
    line-height: 1.15;
  }

  .subjects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
  }

  .subject-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    cursor: pointer;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    position: relative;
    overflow: hidden;
  }
  .subject-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--card-color, var(--accent));
    border-radius: 3px 3px 0 0;
  }
  .subject-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255,255,255,0.15);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }

  .subject-icon {
    font-size: 2.4rem;
    margin-bottom: 16px;
    display: block;
  }
  .subject-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .subject-desc { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }

  .subject-levels { display: flex; gap: 8px; flex-wrap: wrap; }
  .level-tag {
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 0.72rem;
    font-weight: 600;
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  /* ─── COURS PAGE ─── */
  #cours { padding-top: 80px; min-height: 100vh; }

  .filter-bar {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-bottom: 40px;
  }

  .filter-btn {
    padding: 8px 20px;
    border-radius: 50px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn.active, .filter-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .cours-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .cours-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.25s, box-shadow 0.25s;
  }
  .cours-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

  .cours-thumb {
    height: 140px;
    display: flex; align-items: center; justify-content: center;
    font-size: 3.5rem;
    position: relative;
  }

  .cours-body { padding: 20px; }
  .cours-meta {
    display: flex; gap: 8px; margin-bottom: 10px;
  }
  .tag {
    padding: 2px 10px;
    border-radius: 50px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .tag-maths { background: rgba(91,110,248,0.15); color: var(--accent); }
  .tag-physique { background: rgba(248,91,158,0.15); color: var(--accent2); }
  .tag-chimie { background: rgba(91,248,196,0.15); color: var(--accent3); }
  .tag-college { background: rgba(248,194,91,0.12); color: var(--gold); }
  .tag-lycee { background: rgba(180,91,248,0.12); color: #b45bf8; }

  .cours-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 8px;
  }
  .cours-desc { color: var(--muted); font-size: 0.83rem; margin-bottom: 16px; }

  .cours-footer {
    display: flex; align-items: center; justify-content: space-between;
  }
  .cours-duration { color: var(--muted); font-size: 0.78rem; }
  .lock-icon { font-size: 0.8rem; }

  /* ─── MODAL COURS ─── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    z-index: 200;
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    max-width: 700px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 40px;
    position: relative;
    animation: scaleIn 0.25s ease;
  }

  .modal-close {
    position: absolute; top: 20px; right: 20px;
    background: rgba(255,255,255,0.08);
    border: none; color: var(--text);
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    transition: background 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: rgba(255,255,255,0.15); }

  .modal h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .modal-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }

  .lesson-list { display: flex; flex-direction: column; gap: 12px; }
  .lesson-item {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px;
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .lesson-item:hover { border-color: var(--accent); background: rgba(91,110,248,0.05); }

  .lesson-num {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(91,110,248,0.15);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 700;
    flex-shrink: 0;
  }
  .lesson-name { font-weight: 500; font-size: 0.9rem; flex: 1; }
  .lesson-duration { color: var(--muted); font-size: 0.78rem; }
  .lesson-lock { color: var(--muted); font-size: 0.85rem; }

  .modal-action { margin-top: 28px; display: flex; gap: 12px; }

  /* ─── PRICING ─── */
  #tarifs { padding-top: 80px; min-height: 100vh; }

  .pricing-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    max-width: 800px;
    margin: 0 auto;
  }

  .pricing-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px;
    position: relative;
    transition: transform 0.25s;
  }
  .pricing-card:hover { transform: translateY(-4px); }
  .pricing-card.featured {
    border-color: var(--accent);
    background: linear-gradient(145deg, rgba(91,110,248,0.08), var(--surface));
    box-shadow: 0 0 0 1px var(--accent), 0 24px 48px rgba(91,110,248,0.15);
  }

  .pricing-badge {
    position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    padding: 4px 16px;
    border-radius: 50px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .pricing-name {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .pricing-price {
    font-family: 'Syne', sans-serif;
    font-size: 3rem;
    font-weight: 800;
    line-height: 1;
    margin: 16px 0 4px;
  }
  .pricing-price sup { font-size: 1.2rem; vertical-align: top; margin-top: 8px; display: inline-block; }
  .pricing-period { color: var(--muted); font-size: 0.85rem; margin-bottom: 28px; }

  .pricing-features { list-style: none; display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
  .pricing-features li {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.9rem;
  }
  .pricing-features li::before {
    content: '✓';
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(91,248,196,0.15);
    color: var(--accent3);
    font-size: 0.7rem;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-weight: 800;
  }
  .pricing-features li.no::before {
    content: '✕';
    background: rgba(255,255,255,0.05);
    color: var(--muted);
  }
  .pricing-features li.no { color: var(--muted); }

  /* ─── INSCRIPTION / CONNEXION ─── */
  #inscription, #connexion { padding-top: 80px; min-height: 100vh; display: flex; align-items: center; }

  .auth-container {
    max-width: 440px;
    width: 100%;
    margin: 0 auto;
    padding: 24px;
  }

  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
  }

  .auth-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .auth-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; }

  .form-group { margin-bottom: 20px; }
  .form-label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .form-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }

  .form-select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .form-select:focus { border-color: var(--accent); }
  .form-select option { background: var(--surface2); }

  .form-submit {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    margin-top: 8px;
    box-shadow: 0 4px 20px rgba(91,110,248,0.3);
  }
  .form-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(91,110,248,0.5); }

  .auth-switch {
    text-align: center;
    margin-top: 24px;
    color: var(--muted);
    font-size: 0.88rem;
  }
  .auth-switch a { color: var(--accent); cursor: pointer; text-decoration: none; }

  .plan-selector {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px;
  }
  .plan-option {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .plan-option.selected { border-color: var(--accent); background: rgba(91,110,248,0.08); }
  .plan-option input { display: none; }
  .plan-name { font-weight: 600; font-size: 0.9rem; }
  .plan-price { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .plan-tag {
    position: absolute; top: -8px; right: 8px;
    background: var(--gold);
    color: #000;
    font-size: 0.6rem; font-weight: 800;
    padding: 2px 8px; border-radius: 50px;
    text-transform: uppercase;
  }

  /* ─── DASHBOARD ─── */
  #dashboard { padding-top: 80px; min-height: 100vh; display: none; }

  .dash-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 40px; flex-wrap: gap;
  }
  .dash-welcome {
    font-family: 'Syne', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
  }
  .dash-plan {
    padding: 6px 16px;
    border-radius: 50px;
    font-size: 0.78rem; font-weight: 600;
    background: rgba(91,110,248,0.15);
    color: var(--accent);
    border: 1px solid rgba(91,110,248,0.3);
  }

  .progress-cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px; margin-bottom: 40px;
  }
  .progress-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .progress-card-label { color: var(--muted); font-size: 0.8rem; margin-bottom: 8px; }
  .progress-card-value { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; }

  .progress-bar-wrap { margin-top: 10px; }
  .progress-bar {
    height: 4px; background: rgba(255,255,255,0.08);
    border-radius: 4px; overflow: hidden;
  }
  .progress-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent3)); }

  /* ─── FOOTER ─── */
  footer {
    border-top: 1px solid var(--border);
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    position: relative; z-index: 1;
  }
  footer strong { color: var(--text); }
  footer a { color: var(--accent); text-decoration: none; }

  /* ─── TOAST ─── */
  .toast {
    position: fixed; bottom: 32px; right: 32px;
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 16px 24px;
    font-size: 0.9rem;
    z-index: 500;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s ease;
    max-width: 320px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 600px) {
    nav { padding: 0 20px; }
    .nav-links { gap: 16px; }
    .nav-links a:not(.nav-cta):not(:last-child) { display: none; }
    h1 { letter-spacing: -1px; }
    .modal { padding: 28px 20px; }
    .auth-card { padding: 28px 20px; }
    .plan-selector { grid-template-columns: 1fr; }
  }

  /* scroll indicator on home */
  .scroll-hint {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    color: var(--muted); font-size: 0.75rem; letter-spacing: 1px;
    text-transform: uppercase;
    animation: bob 2s ease-in-out infinite;
  }
  .scroll-hint span { font-size: 1.2rem; }
  @keyframes bob { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(6px); } }
</style>

</body>
