<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUCX — Annales Physique-Chimie BAC</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--surface:#0f1120;--surface2:#171929;--border:rgba(255,255,255,0.08);--accent:#5b6ef8;--accent2:#f85b9e;--accent3:#5bf8c4;--gold:#f8c25b;--text:#e8eaf6;--muted:#6b7280;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
.blob{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;opacity:0.08;}
.blob-1{width:500px;height:500px;background:var(--accent2);top:-150px;left:-150px;}
.blob-2{width:400px;height:400px;background:var(--accent);bottom:-100px;right:-100px;}
nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 28px;height:66px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,8,15,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;}
.nav-back{color:var(--muted);text-decoration:none;font-size:0.85rem;}
.wrap{max-width:1100px;margin:0 auto;padding:86px 24px 60px;position:relative;z-index:1;}
.ph{text-align:center;margin-bottom:40px;}
.pt{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;letter-spacing:-1px;margin-bottom:10px;}
.pt span{background:linear-gradient(135deg,var(--accent2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ps{color:var(--muted);font-size:0.92rem;max-width:560px;margin:0 auto 28px;}
/* FILTRES */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;align-items:center;}
.fbtn{padding:7px 16px;border-radius:50px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.2s;}
.fbtn:hover{border-color:rgba(255,255,255,0.2);color:var(--text);}
.fbtn.a{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.search{flex:1;max-width:220px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:7px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.82rem;outline:none;}
.search:focus{border-color:var(--accent);}
.search::placeholder{color:var(--muted);}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:32px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px;text-align:center;}
.snum{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;margin-bottom:3px;}
.slbl{font-size:0.72rem;color:var(--muted);}
/* SECTION */
.sec{margin-bottom:36px;}
.sec-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:11px;border-bottom:2px solid var(--border);}
.sec-ico{font-size:1.6rem;}
.sec-info{flex:1;}
.sec-title{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;}
.sec-sub{color:var(--muted);font-size:0.75rem;margin-top:1px;}
.sec-cnt{font-size:0.68rem;color:var(--muted);background:var(--surface2);border:1px solid var(--border);padding:3px 10px;border-radius:50px;}
/* GRILLE */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;}
/* CARTE */
.card{background:var(--surface);border:1px solid var(--border);border-radius:15px;overflow:hidden;transition:transform 0.2s,border-color 0.2s,box-shadow 0.2s;}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,0.1);box-shadow:0 10px 24px rgba(0,0,0,0.3);}
.card-bar{height:3px;}
.card-bar.pc{background:linear-gradient(90deg,var(--accent2),#f8a25b);}
.card-bar.m{background:linear-gradient(90deg,var(--accent),#7c3aed);}
.card-body{padding:15px 17px 13px;}
.card-tags{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap;}
.tag{padding:2px 8px;border-radius:50px;font-size:0.6rem;font-weight:800;text-transform:uppercase;}
.t-pc{background:rgba(248,91,158,0.15);color:var(--accent2);}
.t-m{background:rgba(91,110,248,0.15);color:var(--accent);}
.t-bac{background:rgba(248,194,91,0.15);color:var(--gold);}
.t-y{background:rgba(91,110,248,0.1);color:var(--accent);}
.t-z{background:rgba(255,255,255,0.06);color:var(--muted);}
.t-e{background:rgba(91,248,196,0.1);color:var(--accent3);}
.card-title{font-family:'Syne',sans-serif;font-weight:800;font-size:0.9rem;margin-bottom:4px;line-height:1.3;}
.card-desc{color:var(--muted);font-size:0.76rem;line-height:1.5;}
.card-pts{display:inline-block;margin-top:7px;font-size:0.68rem;font-weight:700;color:var(--gold);}
/* ACTIONS */
.card-actions{padding:11px 17px;border-top:1px solid var(--border);display:flex;gap:7px;}
.btn-dl{display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 14px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.76rem;font-weight:700;text-decoration:none;transition:all 0.2s;border:none;cursor:pointer;flex:1;}
.btn-dl:hover{transform:translateY(-1px);}
.btn-s{background:var(--accent2);color:#fff;}
.btn-s:hover{background:#d44a87;}
.btn-c{background:rgba(91,248,196,0.1);border:1px solid rgba(91,248,196,0.25);color:var(--accent3);}
.btn-c:hover{background:rgba(91,248,196,0.2);}
.btn-na{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);cursor:default;}
.btn-na:hover{transform:none;}
/* EMPTY */
.empty{text-align:center;padding:48px;color:var(--muted);}
@media(max-width:768px){nav{padding:0 14px;}.wrap{padding:80px 12px 40px;}.stats{grid-template-columns:1fr 1fr;}.grid{grid-template-columns:1fr;}.pt{font-size:1.6rem;}}
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<nav>
  <a href="index.html" class="logo">EDUCX</a>
  <a href="index.html" class="nav-back">← Accueil</a>
</nav>
<div class="wrap">
  <div class="ph">
    <div class="pt">Annales <span>Physique-Chimie BAC</span></div>
    <div class="ps">Sujets officiels avec corrigés — Métropole, Polynésie et plus. Téléchargement direct en PDF.</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="snum" style="color:var(--accent2)" id="totalSujets">0</div><div class="slbl">Sujets disponibles</div></div>
    <div class="stat"><div class="snum" style="color:var(--accent3)" id="totalCorr">0</div><div class="slbl">Avec corrigé</div></div>
    <div class="stat"><div class="snum" style="color:var(--gold)">2022–2023</div><div class="slbl">Années</div></div>
    <div class="stat"><div class="snum" style="color:var(--accent)">PDF</div><div class="slbl">Téléchargement direct</div></div>
  </div>

  <div class="filters">
    <button class="fbtn a" onclick="setFilter('tout',this)">📚 Tout</button>
    <button class="fbtn" onclick="setFilter('2022',this)">2022</button>
    <button class="fbtn" onclick="setFilter('2023',this)">2023</button>
    <button class="fbtn" onclick="setFilter('Métropole',this)">🇫🇷 Métropole</button>
    <button class="fbtn" onclick="setFilter('Polynésie',this)">🌴 Polynésie</button>
    <button class="fbtn" onclick="setFilter('corrige',this)">✓ Avec corrigé</button>
    <input class="search" id="searchIn" placeholder="🔍 Rechercher..." oninput="render()">
  </div>

  <div id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <div style="font-size:2rem;margin-bottom:10px">🔍</div>
    <div style="font-family:Syne;font-weight:800;margin-bottom:5px">Aucun sujet trouvé</div>
    <div>Essaie d'autres filtres</div>
  </div>
</div>

<script>
const DATA = [
  // 2022 MÉTROPOLE J1
  {year:'2022',zone:'Métropole',session:'J1',exo:'Exo 1',topic:'Colorant E127',pts:'10 pts',
   sujet:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2022-Metropole-J1-Exo1-Sujet-ColorantE127-10pts.pdf',
   corrige:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2022-Metropole-J1-Exo1-Correction-ColorantE127-10pts_4.pdf'},
  // 2022 MÉTROPOLE J2
  {year:'2022',zone:'Métropole',session:'J2',exo:'Exo 1',topic:'Mars & Satellite',pts:'10 pts',
   sujet:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2022-Metropole-J2-Exo1-Sujet-Mars-Satellite-10pts.pdf',
   corrige:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2022-Metropole-J2-Exo1-Correction-Mars-Satellite-10pts_1.pdf'},
  {year:'2022',zone:'Métropole',session:'J2',exo:'Exo A',topic:'Vanille & CCM',pts:'5 pts',
   sujet:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2022-Metropole-J2-ExoA-Sujet-VanilleCCM-5pts.pdf',
   corrige:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2022-Metropole-J2-ExoA-Correction-VanilleCCM-5pts.pdf'},
  {year:'2022',zone:'Métropole',session:'J2',exo:'Exo C',topic:'Piles Historiques',pts:'5 pts',
   sujet:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2022-Metropole-J2-ExoC-Sujet-PilesHistoriques-5pts.pdf',
   corrige:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2022-Metropole-J2-ExoC-Correction-PilesHistoriques-5pts_0.pdf'},
  // 2023 POLYNÉSIE
  {year:'2023',zone:'Polynésie',session:'Sept.',exo:'Exo 2',topic:'Conductimétrie (Kholrausch)',pts:'5 pts',
   sujet:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2023-09-Polynesie-Exo2-Sujet-Kholrausch-Qr-Tau-5pts_0.pdf',
   corrige:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2023-09-Polynesie-Exo2-Correction-Kholrausch-Qr-Tau-5pts.pdf'},
  {year:'2023',zone:'Polynésie',session:'Sept.',exo:'Exo 3',topic:'Titrage pH-métrique',pts:'4 pts',
   sujet:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2023-09-Polynesie-Exo3-Sujet-TitragepH-4pts.pdf',
   corrige:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2023-09-Polynesie-Exo3-Correction-TitragepH-4pts.pdf'},
  // 2023 MÉTROPOLE
  {year:'2023',zone:'Métropole',session:'J1',exo:'Exo 1',topic:'Saturne & Mécanique',pts:'11 pts',
   sujet:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2023-Metro-J1-Exo1-Sujet-Saturne-11pts.pdf',
   corrige:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2023-Metro-J1-Exo1-Correction-Saturne-11pts_1.pdf'},
  {year:'2023',zone:'Métropole',session:'J1',exo:'Sujet complet',topic:'Sujet Original Complet',pts:'20 pts',
   sujet:'https://raw.githubusercontent.com/kabtv23-gif/educx/main/2023-Metropole-J1-SujetOriginal.pdf',
   corrige:null},
];

let curFilter = 'tout';

function setFilter(f, btn) {
  curFilter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('a'));
  btn.classList.add('a');
  render();
}

function render() {
  const search = document.getElementById('searchIn').value.toLowerCase();
  let data = DATA;
  if (curFilter !== 'tout') {
    if (curFilter === 'corrige') data = data.filter(d => d.corrige);
    else data = data.filter(d => d.year === curFilter || d.zone.includes(curFilter));
  }
  if (search) data = data.filter(d =>
    d.topic.toLowerCase().includes(search) ||
    d.zone.toLowerCase().includes(search) ||
    d.year.includes(search) ||
    d.exo.toLowerCase().includes(search)
  );

  // Stats
  document.getElementById('totalSujets').textContent = DATA.length;
  document.getElementById('totalCorr').textContent = DATA.filter(d => d.corrige).length;

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');

  if (!data.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  // Grouper par année+zone
  const groups = {};
  data.forEach(d => {
    const k = `${d.year}-${d.zone}`;
    if (!groups[k]) groups[k] = { year: d.year, zone: d.zone, items: [] };
    groups[k].items.push(d);
  });

  grid.innerHTML = Object.values(groups).sort((a,b) => b.year.localeCompare(a.year)).map(g => `
    <div class="sec">
      <div class="sec-hd">
        <span class="sec-ico">${g.zone==='Polynésie'?'🌴':'🇫🇷'}</span>
        <div class="sec-info">
          <div class="sec-title">⚡ Physique-Chimie ${g.year} — ${g.zone}</div>
          <div class="sec-sub">BAC Terminale · Épreuve officielle · PDF direct</div>
        </div>
        <span class="sec-cnt">${g.items.length} sujet${g.items.length>1?'s':''}</span>
      </div>
      <div class="grid">
        ${g.items.map(d => `
          <div class="card">
            <div class="card-bar pc"></div>
            <div class="card-body">
              <div class="card-tags">
                <span class="tag t-pc">⚡ Physique-Chimie</span>
                <span class="tag t-bac">🎓 BAC</span>
                <span class="tag t-y">${d.year}</span>
                <span class="tag t-z">📍 ${d.zone} ${d.session}</span>
                <span class="tag t-e">${d.exo}</span>
              </div>
              <div class="card-title">${d.topic}</div>
              <div class="card-desc">Sujet officiel BAC Terminale · Physique-Chimie Spécialité</div>
              ${d.pts ? `<span class="card-pts">📊 ${d.pts}</span>` : ''}
            </div>
            <div class="card-actions">
              <a href="${d.sujet}" target="_blank" class="btn-dl btn-s">📥 Sujet PDF</a>
              ${d.corrige 
                ? `<a href="${d.corrige}" target="_blank" class="btn-dl btn-c">✓ Corrigé</a>`
                : `<span class="btn-dl btn-na">Corrigé N/D</span>`}
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

render();
</script>
</body>
</html>
