<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUCX — Cours de Physique-Chimie</title>
<style>
  /* Garde le même style que educx-maths.html mais adapte les couleurs */
  :root { --bg: #07080f; --accent: #f85b9e; /* Rose pour la PC */ --text: #e8eaf6; }
  /* ... (Ton CSS de layout) ... */
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title" style="color:var(--accent)">⚗️ Physique-Chimie</div>
    </div>

    <div class="sb-group">
      <div class="sb-group-title">Collège</div>
      <div class="sb-item active" onclick="loadPC('mouvement')"><span class="icon">🏃</span><span class="name">Mouvement & Vitesse</span><span class="sb-badge col">4e-3e</span></div>
      <div class="sb-item" onclick="loadPC('atomes')"><span class="icon">⚛️</span><span class="name">Atomes & Molécules</span><span class="sb-badge col">4e-3e</span></div>
      <div class="sb-item" onclick="loadPC('energie')"><span class="icon">⚡</span><span class="name">Énergie (Cinétique...)</span><span class="sb-badge col">3e</span></div>
    </div>

    <div class="sb-group">
      <div class="sb-group-title">Lycée (Spécialité)</div>
      <div class="sb-item" onclick="loadPC('meca_newton')"><span class="icon">🍎</span><span class="name">Mécanique de Newton</span><span class="sb-badge lyc">Term</span></div>
      <div class="sb-item" onclick="loadPC('ph_metrie')"><span class="icon">🧪</span><span class="name">Acides, Bases & pH</span><span class="sb-badge lyc">Term</span></div>
      <div class="sb-item" onclick="loadPC('thermo')"><span class="icon">🔥</span><span class="name">Thermodynamique</span><span class="sb-badge lyc">Term</span></div>
    </div>
  </aside>

  <main class="main" id="mainContent">
    <div style="padding: 40px;">
      <h1>Bienvenue en Physique-Chimie</h1>
      <p>Sélectionne un chapitre à gauche pour commencer.</p>
    </div>
  </main>
</div>

<script>
  // Tu pourras injecter tes cours de PC ici
  function loadPC(chapId) {
    const main = document.getElementById('mainContent');
    main.innerHTML = `<h1>Chargement du chapitre ${chapId}...</h1>`;
    // Logique de rendu de tes cours...
  }
</script>
</body>
</html>
