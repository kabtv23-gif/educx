<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUCX — Annales Exactes 2020-2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--surface:#0f1120;--surface2:#171929;--border:rgba(255,255,255,0.08);--accent:#5b6ef8;--accent2:#f85b9e;--accent3:#5bf8c4;--gold:#f8c25b;--text:#e8eaf6;--muted:#6b7280;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;}
.blob{position:fixed;border-radius:50%;filter:blur(120px);z-index:0;opacity:0.1;pointer-events:none;}
.blob-1{width:500px;height:500px;background:var(--accent);top:-150px;left:-150px;}
.blob-2{width:400px;height:400px;background:var(--accent2);bottom:-100px;right:-100px;}

nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 32px;height:68px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,8,15,0.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}

.container{max-width:1100px;margin:0 auto;padding:100px 24px 60px;position:relative;z-index:1;}

/* HEADER */
.page-header{text-align:center;margin-bottom:48px;}
.page-title{font-family:'Syne',sans-serif;font-size:2.5rem;font-weight:800;margin-bottom:12px;}
.page-title span{background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* FILTRES */
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:36px;align-items:center;background:var(--surface);padding:20px;border-radius:20px;border:1px solid var(--border);}
.fbtn{padding:8px 18px;border-radius:50px;border:1px solid var(--border);background:transparent;color:var(--muted);font-weight:600;cursor:pointer;transition:0.2s;font-size:0.85rem;}
.fbtn.active{background:var(--accent);color:white;border-color:var(--accent);}
.search-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 16px;color:white;outline:none;}

/* GRID */
.sujets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;}
.sujet-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:0.3s;display:flex;flex-direction:column;}
.sujet-card:hover{transform:translateY(-5px);border-color:var(--accent);}
.sujet-top{padding:20px;flex-grow:1;}
.bar-maths{height:4px;background:var(--accent);}
.bar-physique{height:4px;background:var(--accent2);}
.bar-chimie{height:4px;background:var(--accent3);}

.stag{padding:3px 10px;border-radius:50px;font-size:0.65rem;font-weight:800;text-transform:uppercase;margin-right:5px;}
.stag-bac{background:rgba(91,110,248,0.1);color:var(--accent);}
.stag-brevet{background:rgba(248,91,158,0.1);color:var(--accent2);}
.stag-year{background:rgba(248,194,91,0.15);color:var(--gold);}

.sujet-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;margin:10px 0 5px;}
.sujet-desc{color:var(--muted);font-size:0.85rem;margin-bottom:15px;}

.sujet-actions{padding:15px 20px;border-top:1px solid var(--border);display:flex;gap:10px;}
.btn-pdf{flex:1;padding:10px;text-align:center;border-radius:10px;text-decoration:none;font-weight:700;font-size:0.8rem;transition:0.2s;}
.btn-main{background:var(--accent);color:white;}
.btn-corrige{background:rgba(91,248,196,0.1);color:var(--accent3);border:1px solid rgba(91,248,196,0.2);}

@media(max-width:768px){.search-input{width:100%;}}
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<nav>
  <a href="#" class="logo">EDUCX</a>
</nav>

<div class="container">
  <div class="page-header">
    <div class="page-title">Annales Officielles <span>2020 — 2026</span></div>
    <p style="color:var(--muted)">Sujets de Bac (Maths) et Labolycée (Physique/Chimie)</p>
  </div>

  <div class="filters">
      <button class="fbtn active" onclick="filter('tout', this)">Tout</button>
      <button class="fbtn" onclick="filter('maths', this)">📐 Maths</button>
      <button class="fbtn" onclick="filter('physique', this)">⚡ Physique</button>
      <button class="fbtn" onclick="filter('chimie', this)">🧪 Chimie</button>
      <input class="search-input" id="searchInput" placeholder="Rechercher une zone ou une année (ex: Métropole, 2024...)" oninput="search()">
  </div>

  <div id="sujetsGrid" class="sujets-grid"></div>
</div>

<script>

    url: 'https://www.sujetdebac.fr/annales-pdf/2024/spe-mathematiques-2024-amerique-du-nord-1-sujet.pdf',
    corrige: 'https://www.sujetdebac.fr/annales-pdf/2024/spe-mathematiques-2024-amerique-du-nord-1-corrige.pdf'
  },
  {
    id: 3, mat: 'maths', type: 'bac', annee: 2023, zone: 'Métropole (Jour 1)',
    titre: 'Bac Maths 2023 — Métropole J1',
    desc: 'Probabilités conditionnelles, QCM géométrie.',
    url: 'https://www.sujetdebac.fr/annales-pdf/2023/spe-mathematiques-2023-metropole-1-sujet.pdf',

  },

  // ==========================================

  },
  {
    id: 11, mat: 'physique', type: 'bac', annee: 2022, zone: 'Antilles-Guyane',

  },
  {
    id: 12, mat: 'physique', type: 'bac', annee: 2021, zone: 'Métropole',

    corrige: 'https://labolycee.org/2021-Metropole-Sujet1-Correction.pdf'
  },
  
  // ==========================================
  // SUJETS ZERO / SPECIMENS 2025-2026
  // ==========================================
  {
    id: 13, mat: 'maths', type: 'bac', annee: 2026, zone: 'Sujet Zéro',
    titre: 'Maths 2026 — Sujet Zéro Officiel',
    desc: 'Spécimen du ministère pour la nouvelle session.',
    url: 'https://www.sujetdebac.fr/annales-pdf/2024/spe-mathematiques-2024-sujet-zero.pdf', 
    corrige: 'https://www.sujetdebac.fr/annales-pdf/2024/spe-mathematiques-2024-sujet-zero-corrige.pdf'
  },
  {
    id: 14, mat: 'physique', type: 'bac', annee: 2025, zone: 'Nouvelle-Calédonie',
    titre: 'Physique-Chimie 2025 — N-Calédonie',
    desc: 'Premier sujet tombé pour l\'année 2025.',
    url: 'https://labolycee.org/2025-NouvelleCaledonie-Sujet.pdf',
    corrige: 'https://labolycee.org/2025-NouvelleCaledonie-Sujet-Correction.pdf'
  }
];

let currentFilter = 'tout';

function render(data) {
  const grid = document.getElementById('sujetsGrid');
  grid.innerHTML = data.map(s => `
    <div class="sujet-card">
      <div class="bar-${s.mat}"></div>
      <div class="sujet-top">
        <div style="margin-bottom:8px">
          <span class="stag stag-${s.type}">${s.type.toUpperCase()}</span>
          <span class="stag stag-year">${s.annee}</span>
          <span class="stag" style="background:rgba(255,255,255,0.05);">${s.zone}</span>
        </div>
        <div class="sujet-title">${s.titre}</div>
        <div class="sujet-desc">${s.desc}</div>
      </div>
      <div class="sujet-actions">
        <a href="${s.url}" target="_blank" class="btn-pdf btn-main">Sujet PDF</a>
        <a href="${s.corrige}" target="_blank" class="btn-pdf btn-corrige">Corrigé PDF</a>
      </div>
    </div>
  `).join('');
}

function filter(mat, btn) {
  currentFilter = mat;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  search();
}

function search() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = SUJETS.filter(s => {
    const matchMat = currentFilter === 'tout' || s.mat === currentFilter;
    const matchText = s.titre.toLowerCase().includes(query) || s.zone.toLowerCase().includes(query) || s.annee.toString().includes(query);
    return matchMat && matchText;
  });
  render(filtered);
}

// Initial render
render(SUJETS);
</script>
</body>
</html>
