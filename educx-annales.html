<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Annales - Bac & Brevet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .subject-card { transition: transform 0.2s; }
        .subject-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <header class="bg-blue-600 text-white py-8 shadow-lg mb-8">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold">📚 Bibliothèque d'Annales</h1>
            <p class="mt-2 opacity-90">Retrouve tous les sujets et corrigés officiels</p>
        </div>
    </header>

    <main class="container mx-auto px-4 pb-12">
        
        <div class="flex flex-wrap justify-center gap-4 mb-10">
            <button onclick="filter('all')" class="bg-gray-800 text-white px-6 py-2 rounded-full hover:bg-gray-700 transition">Tout</button>
            <button onclick="filter('bac')" class="bg-indigo-500 text-white px-6 py-2 rounded-full hover:bg-indigo-600 transition">🎓 Bac</button>
            <button onclick="filter('brevet')" class="bg-emerald-500 text-white px-6 py-2 rounded-full hover:bg-emerald-600 transition">✏️ Brevet</button>
            <button onclick="filter('maths')" class="bg-orange-500 text-white px-6 py-2 rounded-full hover:bg-orange-600 transition">➕ Maths</button>
            <button onclick="filter('physique')" class="bg-purple-500 text-white px-6 py-2 rounded-full hover:bg-purple-600 transition">🧪 Physique-Chimie</button>
        </div>

        <div id="sujets-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <script>
        const SUJETS = [
            // --- BAC MATHS ---
            { id: 101, mat: 'maths', type: 'bac', annee: 2025, zone: 'Métropole (J1)', titre: 'Bac Maths 2025', url: 'https://www.apmep.fr/IMG/pdf/Metro_J1_17_06_2025_DV.pdf', corrige: 'https://www.apmep.fr/IMG/pdf/Corrige__Me_tropole_spe_J1_17_06_2025_VTFK.pdf' },
            { id: 102, mat: 'maths', type: 'bac', annee: 2025, zone: 'Métropole (J2)', titre: 'Bac Maths 2025', url: 'https://www.apmep.fr/IMG/pdf/Metropole__spe_J2_18_06_2025_DV_2.pdf', corrige: 'https://www.apmep.fr/IMG/pdf/Corrige_spe_Metropole_18_06_2025_DV.pdf' },
            { id: 103, mat: 'maths', type: 'bac', annee: 2024, zone: 'Am. du Nord', titre: 'Bac Maths 2024', url: 'https://www.apmep.fr/IMG/pdf/Spe__Ame_rique_Nord_J2_22_mai_2024.pdf', corrige: 'https://www.apmep.fr/IMG/pdf/Corrige_spe_Amerique_Nord_22_05_2024_DV.pdf' },
            
            // --- BAC PHYSIQUE ---
            { id: 201, mat: 'physique', type: 'bac', annee: 2025, zone: 'Métropole', titre: 'Bac Physique 2025', url: 'https://labolycée.org/bac-2025-metropole-jour-1#sujet', corrige: 'https://labolycée.org/bac-2025-metropole-jour-1#corrige' },
            
            // --- BREVET MATHS ---
            { id: 301, mat: 'maths', type: 'brevet', annee: 2026, zone: 'Sujet Zéro', titre: 'Brevet Maths 2026', url: 'https://www.apmep.fr/IMG/pdf/Brevet_0_A_2026_DV.pdf', corrige: 'https://www.apmep.fr/IMG/pdf/Brevet_0_A_2026_DV.pdf' },
            { id: 302, mat: 'maths', type: 'brevet', annee: 2025, zone: 'Métropole', titre: 'Brevet Maths 2025', url: 'https://www.apmep.fr/IMG/pdf/Brevet_Me_tropole_26_06_2025_FK.pdf', corrige: 'https://www.apmep.fr/IMG/pdf/Corrige_Brevet_Metropole_26_06_2025_DV.pdf' },
            { id: 303, mat: 'maths', type: 'brevet', annee: 2024, zone: 'Martinique', titre: 'Brevet Maths 2024', url: 'https://www.apmep.fr/IMG/pdf/Brevet_Martinique_3_07_2024_DV.pdf', corrige: 'https://www.apmep.fr/IMG/pdf/Corrige_Brevet_Martinique_3_07_2024_DV-2.pdf' },
            
            // --- BREVET PHYSIQUE ---
            { id: 401, mat: 'physique', type: 'brevet', annee: 2025, zone: 'Métropole', titre: 'Brevet Physique 2025', url: 'https://www.digischool.fr/annales/sujet-officiel-physique-chimie-dnb-france-2025-vbj1', corrige: 'https://www.digischool.fr/annales/corrige-physique-chimie-dnb-france-2025-o5s5' }
        ];

        function render(data) {
            const grid = document.getElementById('sujets-grid');
            grid.innerHTML = data.map(s => `
                <div class="subject-card bg-white p-6 rounded-xl shadow-md border-l-4 ${s.type === 'bac' ? 'border-indigo-500' : 'border-emerald-500'}">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-xs font-bold uppercase tracking-wider px-2 py-1 rounded ${s.type === 'bac' ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700'}">
                            ${s.type} ${s.mat}
                        </span>
                        <span class="text-gray-500 font-medium">${s.annee}</span>
                    </div>
                    <h3 class="text-lg font-bold mb-1">${s.titre}</h3>
                    <p class="text-sm text-gray-600 mb-6">${s.zone}</p>
                    <div class="grid grid-cols-2 gap-3">
                        <a href="${s.url}" target="_blank" class="text-center bg-gray-100 text-gray-700 py-2 rounded-lg text-sm font-semibold hover:bg-gray-200">Sujet PDF</a>
                        <a href="${s.corrige}" target="_blank" class="text-center bg-blue-50 text-blue-600 py-2 rounded-lg text-sm font-semibold hover:bg-blue-100">Corrigé</a>
                    </div>
                </div>
            `).join('');
        }

        function filter(criteria) {
            if (criteria === 'all') render(SUJETS);
            else if (['bac', 'brevet'].includes(criteria)) render(SUJETS.filter(s => s.type === criteria));
            else if (['maths', 'physique'].includes(criteria)) render(SUJETS.filter(s => s.mat === criteria));
        }

        // Affichage initial
        render(SUJETS);
    </script>
</body>
</html>
