<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUCX — Base de Données Annales 2020-2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--surface:#0f1120;--surface2:#171929;--border:rgba(255,255,255,0.08);--accent:#5b6ef8;--accent2:#f85b9e;--accent3:#5bf8c4;--gold:#f8c25b;--text:#e8eaf6;--muted:#6b7280;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;}
.blob{position:fixed;border-radius:50%;filter:blur(120px);z-index:0;opacity:0.1;pointer-events:none;}
.blob-1{width:500px;height:500px;background:var(--accent);top:-150px;left:-150px;}

nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 32px;height:68px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,8,15,0.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}

.container{max-width:1200px;margin:0 auto;padding:100px 24px 60px;position:relative;z-index:1;}
.page-header{text-align:center;margin-bottom:40px;}
.page-title{font-family:'Syne',sans-serif;font-size:2.5rem;font-weight:800;}
.page-title span{color:var(--accent3);}

.filters{background:var(--surface);padding:20px;border-radius:20px;border:1px solid var(--border);margin-bottom:30px;display:flex;flex-direction:column;gap:15px;}
.filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.fbtn{padding:8px 16px;border-radius:50px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:0.8rem;font-weight:600;}
.fbtn.active{background:var(--accent);color:white;border-color:var(--accent);}
.search-input{flex:1;background:var(--surface2);border:1px solid var(--border);padding:10px;border-radius:10px;color:white;outline:none;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:0.3s;display:flex;flex-direction:column;}
.card:hover{transform:translateY(-5px);border-color:var(--accent);}
.card-bar{height:4px;}
.maths-bar{background:var(--accent);}
.physique-bar{background:var(--accent2);}
.chimie-bar{background:var(--accent3);}

.card-content{padding:20px;flex-grow:1;}
.tag-row{margin-bottom:10px;}
.tag{font-size:0.6rem;font-weight:800;padding:3px 8px;border-radius:4px;text-transform:uppercase;margin-right:5px;background:rgba(255,255,255,0.05);}
.tag-year{color:var(--gold);border:1px solid rgba(248,194,91,0.2);}

.card-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;margin-bottom:8px;}
.preview-list{background:rgba(0,0,0,0.2);padding:12px;border-radius:10px;font-size:0.75rem;color:var(--muted);margin-bottom:15px;}
.preview-list div{margin-bottom:4px;display:flex;gap:8px;}
.q-num{color:var(--accent3);font-weight:bold;}

.card-actions{padding:15px;display:flex;gap:10px;border-top:1px solid var(--border);}
.btn{flex:1;padding:10px;text-align:center;border-radius:8px;text-decoration:none;font-weight:700;font-size:0.8rem;}
.btn-primary{background:var(--accent);color:white;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
</style>
</head>
<body>
<div class="blob blob-1"></div>

<nav>
    <a href="#" class="logo">EDUCX</a>
</nav>

<div class="container">
    <div class="page-header">
        <h1 class="page-title">Annales <span>2020 — 2026</span></h1>
        <p style="color:var(--muted)">Mathématiques, Physique & Chimie (Toutes zones)</p>
    </div>

    <div class="filters">
        <div class="filter-row">
            <button class="fbtn active" onclick="setMat('tout', this)">Toutes matières</button>
            <button class="fbtn" onclick="setMat('maths', this)">📐 Maths</button>
            <button class="fbtn" onclick="setMat('physique', this)">⚡ Physique</button>
            <button class="fbtn" onclick="setMat('chimie', this)">🧪 Chimie</button>
        </div>
        <div class="filter-row">
            <input type="text" class="search-input" id="search" placeholder="Filtrer par zone ou chapitre (ex: Amérique du Nord, Probabilités...)" onkeyup="render()">
        </div>
    </div>

    <div class="grid" id="mainGrid"></div>
</div>

<script>
// Génération massive de données pour 2020-2026
const zones = ["Métropole", "Amérique du Nord", "Asie-Pacifique", "Centres Étrangers", "Antilles-Guyane", "Polynésie"];
const matieres = [
    {id:'maths', n:'Mathématiques', base:'https://www.sujetdebac.fr/annales-generale/specialite-mathematiques/'},
    {id:'physique', n:'Physique', base:'https://labolycee.org/annales-bac-physique-chimie-par-annee/'},
    {id:'chimie', n:'Chimie', base:'https://labolycee.org/annales-bac-physique-chimie-par-annee/'}
];

const SUJETS = [];

// Boucle pour peupler la base de données de 2020 à 2026
for(let annee = 2026; annee >= 2020; annee--) {
    matieres.forEach(m => {
        zones.forEach(z => {
            // Simulation de sujets (à remplacer par tes liens PDF précis si tu les as)
            SUJETS.push({
                annee: annee,
                zone: z,
                matiere: m.id,
                matiereNom: m.n,
                titre: `${m.n} — ${z} ${annee}`,
                preview: annee >= 2025 ? ["Sujet Prédictif", "Dernière Réforme", "Entraînement"] : ["Exercice 1 : Analyse", "Exercice 2 : Spécialité", "Exercice 3 : QCM"],
                urlSujet: m.id === 'maths' ? `${m.base}${annee}/` : `${m.base}#${annee}`,
                urlCorrige: m.id === 'maths' ? `${m.base}${annee}/` : `${m.base}#${annee}`
            });
        });
    });
}

let activeMat = 'tout';

function setMat(m, btn) {
    activeMat = m;
    document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
}

function render() {
    const grid = document.getElementById('mainGrid');
    const search = document.getElementById('search').value.toLowerCase();
    
    const filtered = SUJETS.filter(s => {
        const mMatch = activeMat === 'tout' || s.matiere === activeMat;
        const sMatch = s.titre.toLowerCase().includes(search) || s.zone.toLowerCase().includes(search);
        return mMatch && sMatch;
    });

    grid.innerHTML = filtered.map(s => `
        <div class="card">
            <div class="card-bar ${s.matiere}-bar"></div>
            <div class="card-content">
                <div class="tag-row">
                    <span class="tag tag-year">${s.annee}</span>
                    <span class="tag">${s.zone}</span>
                </div>
                <div class="card-title">${s.titre}</div>
                <div class="preview-list">
                    ${s.preview.map((p, i) => `<div><span class="q-num">${i+1}</span> ${p}</div>`).join('')}
                </div>
            </div>
            <div class="card-actions">
                <a href="${s.urlSujet}" target="_blank" class="btn btn-primary">Sujet</a>
                <a href="${s.urlCorrige}" target="_blank" class="btn btn-secondary">Corrigé</a>
            </div>
        </div>
    `).join('');
}

// Initialisation
render();
</script>
</body>
</html>
