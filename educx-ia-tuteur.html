<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUCX — Tuteur IA Gemini</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--surface:#0f1120;--surface2:#171929;--border:rgba(255,255,255,0.08);--accent:#5b6ef8;--accent2:#f85b9e;--accent3:#5bf8c4;--gold:#f8c25b;--text:#e8eaf6;--muted:#6b7280;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
.blob{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;opacity:0.1;}
.blob-1{width:500px;height:500px;background:var(--accent);top:-150px;left:-150px;}
.blob-2{width:400px;height:400px;background:var(--accent2);bottom:-100px;right:-100px;}
nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 28px;height:66px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,8,15,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none;}
.ai-badge{display:flex;align-items:center;gap:6px;padding:5px 14px;background:rgba(91,110,248,0.1);border:1px solid rgba(91,110,248,0.3);border-radius:50px;font-size:0.75rem;font-weight:700;color:var(--accent3);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent3);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.layout{display:flex;padding-top:66px;min-height:100vh;}
.sidebar{width:255px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);height:calc(100vh - 66px);position:sticky;top:66px;overflow-y:auto;padding:18px 0;}
.sbt{font-size:0.65rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent);padding:0 16px 12px;border-bottom:1px solid var(--border);margin-bottom:10px;display:block;}
.mb{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;border-left:3px solid transparent;font-size:0.82rem;font-weight:500;width:100%;background:transparent;border-top:none;border-right:none;border-bottom:none;color:var(--muted);text-align:left;transition:all 0.15s;}
.mb:hover{background:rgba(91,110,248,0.07);color:var(--text);}
.mb.active{background:rgba(91,110,248,0.12);border-left-color:var(--accent);color:var(--accent);}
.mi{font-size:1.3rem;width:26px;text-align:center;}
.mn{font-weight:700;font-size:0.82rem;}
.md{font-size:0.68rem;color:var(--muted);margin-top:1px;}
.mb.active .md{color:rgba(91,110,248,0.6);}
.lsec{padding:12px 16px 5px;font-size:0.6rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.llist{padding:0 8px;}
.li{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:9px;font-size:0.76rem;margin-bottom:3px;}
.li.r{color:var(--accent2);background:rgba(248,91,158,0.08);}
.li.o{color:var(--gold);background:rgba(248,194,91,0.07);}
.ld{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.ld.r{background:var(--accent2);}
.ld.o{background:var(--gold);}
.main{flex:1;display:flex;flex-direction:column;z-index:1;max-width:calc(100% - 255px);}
.page{display:none;flex:1;flex-direction:column;}
.page.active{display:flex;}
/* HOME */
#page-home{align-items:center;justify-content:center;padding:36px 20px;text-align:center;}
.hico{font-size:4rem;margin-bottom:18px;animation:float 3s ease infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.ht{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;margin-bottom:8px;}
.ht span{background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hs{color:var(--muted);font-size:0.95rem;max-width:480px;margin:0 auto 36px;}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:580px;width:100%;}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;cursor:pointer;transition:all 0.2s;text-align:left;}
.mc:hover{border-color:rgba(91,110,248,0.3);transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,0.3);}
.mci{font-size:1.8rem;margin-bottom:10px;display:block;}
.mct{font-family:'Syne',sans-serif;font-weight:800;font-size:0.95rem;margin-bottom:5px;}
.mcd{font-size:0.78rem;color:var(--muted);line-height:1.5;}
.mctag{display:inline-block;margin-top:8px;font-size:0.6rem;padding:2px 8px;border-radius:50px;font-weight:700;}
.tb{background:rgba(91,110,248,0.12);color:var(--accent);}
.tp{background:rgba(248,91,158,0.12);color:var(--accent2);}
.tg{background:rgba(91,248,196,0.12);color:var(--accent3);}
.tgd{background:rgba(248,194,91,0.12);color:var(--gold);}
.pow{margin-top:20px;font-size:0.73rem;color:var(--muted);display:flex;align-items:center;gap:5px;justify-content:center;}
/* CHAT */
.chat-hd{padding:16px 24px 13px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.chm{font-family:'Syne',sans-serif;font-size:0.82rem;font-weight:800;}
.pills{display:flex;gap:5px;flex-wrap:wrap;}
.pill{padding:4px 12px;border-radius:50px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.73rem;font-weight:600;cursor:pointer;transition:all 0.2s;}
.pill.a{background:var(--accent);border-color:var(--accent);color:#fff;}
.msgs{flex:1;overflow-y:auto;padding:18px 24px;display:flex;flex-direction:column;gap:14px;}
.msgs::-webkit-scrollbar{width:3px;}
.msgs::-webkit-scrollbar-thumb{background:var(--border);}
.msg{display:flex;gap:10px;animation:mi .3s ease;}
@keyframes mi{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.msg.u{flex-direction:row-reverse;}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.av.ai{background:linear-gradient(135deg,var(--accent),var(--accent3));}
.av.u{background:linear-gradient(135deg,var(--accent2),var(--gold));}
.bub{max-width:78%;padding:12px 16px;border-radius:15px;font-size:0.88rem;line-height:1.7;}
.bub.ai{background:var(--surface2);border:1px solid var(--border);border-radius:4px 15px 15px 15px;}
.bub.u{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;border-radius:15px 4px 15px 15px;}
.typ{display:flex;gap:4px;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:4px 15px 15px 15px;width:fit-content;}
.typ span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:typ 1.4s ease infinite;}
.typ span:nth-child(2){animation-delay:.2s;}
.typ span:nth-child(3){animation-delay:.4s;}
@keyframes typ{0%,80%,100%{transform:scale(.6);opacity:.4;}40%{transform:scale(1);opacity:1;}}
.inp-wrap{padding:12px 24px;border-top:1px solid var(--border);background:rgba(7,8,15,.6);backdrop-filter:blur(10px);}
.prevwrap{margin-bottom:7px;}
.prev{position:relative;display:inline-block;}
.prev img{max-width:170px;max-height:120px;border-radius:9px;border:1px solid var(--border);}
.prev-rm{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--accent2);color:#fff;border:none;cursor:pointer;font-size:.65rem;display:flex;align-items:center;justify-content:center;}
.inrow{display:flex;gap:8px;align-items:flex-end;}
.pbtn{width:42px;height:42px;border-radius:10px;background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);font-size:1rem;cursor:pointer;transition:all .2s;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.pbtn:hover{border-color:var(--accent2);color:var(--accent2);}
.cin{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none;resize:none;min-height:44px;max-height:110px;line-height:1.5;transition:border-color .2s;}
.cin:focus{border-color:var(--accent);}
.cin::placeholder{color:var(--muted);}
.sbtn{width:42px;height:42px;border-radius:10px;background:var(--accent);border:none;color:#fff;font-size:1rem;cursor:pointer;transition:all .2s;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.sbtn:hover{background:#7c3aed;}
.sbtn:disabled{opacity:.4;cursor:default;}
/* PHOTO */
.phd{padding:16px 24px 13px;border-bottom:1px solid var(--border);background:var(--surface);}
.pht{font-family:'Syne',sans-serif;font-weight:800;font-size:1.05rem;margin-bottom:3px;}
.phs{color:var(--muted);font-size:.8rem;}
.phzone{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
.upz{border:2px dashed rgba(91,110,248,.3);border-radius:18px;padding:40px 24px;text-align:center;cursor:pointer;transition:all .25s;max-width:460px;width:100%;background:rgba(91,110,248,.02);}
.upz:hover,.upz.ov{border-color:var(--accent);background:rgba(91,110,248,.06);}
.upi{font-size:3rem;margin-bottom:12px;display:block;}
.upt{font-family:'Syne',sans-serif;font-weight:800;font-size:1.05rem;margin-bottom:6px;}
.ups{color:var(--muted);font-size:.83rem;margin-bottom:20px;}
.upb{background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:50px;font-family:'DM Sans',sans-serif;font-weight:700;cursor:pointer;transition:all .2s;}
.upb:hover{transform:translateY(-2px);}
.phres{flex:1;padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;}
.ri{border-radius:12px;overflow:hidden;border:1px solid var(--border);max-height:260px;display:flex;align-items:center;background:var(--surface);}
.ri img{max-width:100%;max-height:260px;object-fit:contain;}
.ac{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;}
.ahd{display:flex;align-items:center;gap:11px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.ai2{font-size:1.7rem;}
.at{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;}
.as{color:var(--muted);font-size:.78rem;}
.sw{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface2);border-radius:11px;margin-bottom:14px;}
.sc2{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:1.25rem;flex-shrink:0;}
.sb2{height:4px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;margin-top:4px;}
.sf{height:100%;border-radius:4px;transition:width 1s ease;}
.slbl{font-size:.62rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:7px;}
.slbl.r{color:var(--accent2);}
.slbl.g{color:var(--accent3);}
.ei{display:flex;gap:9px;padding:9px 11px;background:var(--surface2);border-radius:9px;margin-bottom:6px;align-items:flex-start;}
.en{width:20px;height:20px;border-radius:50%;background:rgba(248,91,158,.12);color:var(--accent2);font-size:.62rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.et{font-size:.81rem;color:var(--text);line-height:1.6;flex:1;}
.ec{font-size:.74rem;color:var(--accent3);margin-top:3px;}
.pb2{background:linear-gradient(135deg,rgba(91,110,248,.08),rgba(91,248,196,.04));border:1px solid rgba(91,110,248,.2);border-radius:13px;padding:14px;margin-top:12px;}
.pbt{font-family:'Syne',sans-serif;font-weight:800;font-size:.88rem;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.pit{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border-radius:9px;font-size:.8rem;margin-bottom:6px;}
.rtrybtn{width:100%;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:50px;padding:9px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.8rem;cursor:pointer;margin-top:10px;transition:all .2s;}
.rtrybtn:hover{border-color:var(--accent);color:var(--text);}
.ldw{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px;}
.spin{width:42px;height:42px;border-radius:50%;border:3px solid var(--border);border-top:3px solid var(--accent);animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.lt{color:var(--muted);font-size:.85rem;}
/* QUIZ */
.qhd{padding:14px 24px 12px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.qpw{flex:1;}
.qpb{height:4px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;}
.qpf{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent3));transition:width .4s;}
.qpt{font-size:.68rem;color:var(--muted);margin-top:3px;text-align:right;}
.qcon{flex:1;padding:22px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;}
.qscr{display:none;width:100%;max-width:560px;}
.qscr.a{display:flex;flex-direction:column;gap:12px;}
.qi{text-align:center;padding:12px 0;}
.qiico{font-size:3.5rem;margin-bottom:12px;}
.qit{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;margin-bottom:6px;}
.qis{color:var(--muted);margin-bottom:22px;}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px;}
.scd{padding:13px;border-radius:13px;border:1.5px solid var(--border);background:transparent;cursor:pointer;transition:all .2s;text-align:center;font-family:'DM Sans',sans-serif;}
.scd.sel{border-color:var(--accent);background:rgba(91,110,248,.1);}
.scdi{font-size:1.5rem;display:block;margin-bottom:4px;}
.scdn{font-weight:700;font-size:.85rem;color:var(--text);}
.bst{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;border:none;padding:13px 34px;border-radius:50px;font-family:'DM Sans',sans-serif;font-weight:800;font-size:.92rem;cursor:pointer;transition:all .2s;box-shadow:0 4px 18px rgba(91,110,248,.3);}
.bst:hover{transform:translateY(-2px);}
.qqc{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;position:relative;overflow:hidden;}
.qqc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));}
.qqm{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.qmt{font-size:.64rem;padding:2px 8px;border-radius:50px;font-weight:700;}
.qmn{color:var(--muted);background:rgba(255,255,255,.05);}
.qmc{background:rgba(91,110,248,.1);color:var(--accent);}
.qmd.f{background:rgba(91,248,196,.1);color:var(--accent3);}
.qmd.m{background:rgba(248,194,91,.1);color:var(--gold);}
.qmd.d{background:rgba(248,91,158,.1);color:var(--accent2);}
.qqt{font-family:'Syne',sans-serif;font-size:1.08rem;font-weight:700;line-height:1.4;color:var(--text);}
.qans2{display:flex;flex-direction:column;gap:8px;}
.qa{padding:12px 16px;border-radius:11px;border:1.5px solid var(--border);background:transparent;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.86rem;cursor:pointer;transition:all .2s;text-align:left;display:flex;align-items:center;gap:10px;}
.qa:hover:not(:disabled){border-color:var(--accent);background:rgba(91,110,248,.06);transform:translateX(3px);}
.qa.c{background:rgba(91,248,196,.08);border-color:var(--accent3);color:var(--accent3);}
.qa.w{background:rgba(248,91,158,.06);border-color:var(--accent2);color:var(--accent2);}
.qa:disabled{cursor:default;}
.al{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.06);font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);}
.qfb2{padding:13px;border-radius:12px;border:1px solid var(--border);}
.qfb2.c{background:rgba(91,248,196,.06);border-color:rgba(91,248,196,.2);}
.qfb2.w{background:rgba(248,91,158,.06);border-color:rgba(248,91,158,.2);}
.qfbi{font-size:1.3rem;margin-bottom:6px;}
.qfbt{font-family:'Syne',sans-serif;font-weight:800;font-size:.92rem;margin-bottom:3px;}
.qfbs{font-size:.8rem;color:var(--muted);line-height:1.5;}
.qfbg{font-size:.8rem;color:var(--text);line-height:1.6;margin-top:7px;padding-top:7px;border-top:1px solid var(--border);}
.bnxt{align-self:flex-end;background:var(--accent);color:#fff;border:none;padding:9px 20px;border-radius:50px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:.83rem;cursor:pointer;transition:all .2s;}
.bnxt:hover{transform:translateY(-1px);}
.qres{text-align:center;padding:12px 0;}
.qrs{font-family:'Syne',sans-serif;font-size:3.8rem;font-weight:800;line-height:1;margin-bottom:6px;}
.qrl{color:var(--muted);font-size:.88rem;margin-bottom:22px;}
.lres{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
.lrt{font-family:'Syne',sans-serif;font-weight:800;font-size:.92rem;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.lri{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.81rem;}
.lri:last-child{border-bottom:none;}
.lrb{width:85px;height:4px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;margin:0 9px;}
.lrf{height:100%;border-radius:4px;}
.lrp{font-weight:700;font-size:.73rem;width:30px;text-align:right;}
.bpar{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:none;padding:11px 24px;border-radius:50px;font-family:'DM Sans',sans-serif;font-weight:800;font-size:.88rem;cursor:pointer;transition:all .2s;margin-right:9px;}
.bpar:hover{transform:translateY(-2px);}
.brtr{background:transparent;color:var(--text);border:1px solid var(--border);padding:11px 24px;border-radius:50px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.88rem;cursor:pointer;transition:all .2s;}
.brtr:hover{border-color:var(--accent);}
@media(max-width:768px){.sidebar{display:none;}.main{max-width:100%;}nav{padding:0 14px;}.msgs,.chat-hd,.inp-wrap,.phd,.phzone,.phres,.qhd,.qcon{padding-left:12px;padding-right:12px;}.mgrid{grid-template-columns:1fr;}}
</style>
<script>
MathJax = {
  tex: { inlineMath:[['\\(','\\)'],['$','$']], displayMath:[['\\[','\\]'],['$$','$$']] },

  startup: { typeset: false }
};
</script>

</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<nav>
  <a href="index.html" class="logo">EDUCX</a>
  <div style="display:flex;gap:10px;align-items:center">
    <div class="ai-badge"><div class="dot"></div>Gemma 2 IA</div>
    <a href="index.html" style="color:var(--muted);text-decoration:none;font-size:.83rem">← Accueil</a>
  </div>
</nav>
<div class="layout">
<aside class="sidebar">
  <span class="sbt">🧠 Tuteur IA</span>
  <button class="mb active" onclick="sp('home',this)"><span class="mi">🏠</span><div><div class="mn">Accueil</div><div class="md">Choisir un mode</div></div></button>
  <button class="mb" onclick="sp('chat',this)"><span class="mi">💬</span><div><div class="mn">Tuteur conversationnel</div><div class="md">Pose tes questions</div></div></button>
  <button class="mb" onclick="sp('photo',this)"><span class="mi">📸</span><div><div class="mn">Analyse de copie</div><div class="md">Photo → corrections</div></div></button>
  <button class="mb" onclick="sp('quiz',this)"><span class="mi">🧠</span><div><div class="mn">Quiz adaptatif</div><div class="md">Détection lacunes</div></div></button>
